<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mainframe — A.R.I.A</title>
  <link href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    :root {
      --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, sans-serif;
    }
    body { margin: 0; font-family: var(--font-body); background: #fff; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor-blink { animation: blink 1s step-end infinite; }
    .back-link { position: fixed; left: 12px; bottom: 12px; z-index: 70; font: 12px system-ui, sans-serif; color: #111; padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(255,255,255,.85); backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4';
    const SENSITIVITY = 0.8;
    const EMAIL = 'hello@mainframe.co';

    function useTypewriter(text, speed = 38, startDelay = 600) {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);
      useEffect(() => {
        let i = 0, interval;
        const start = setTimeout(() => {
          interval = setInterval(() => {
            i++;
            setDisplayed(text.slice(0, i));
            if (i >= text.length) { clearInterval(interval); setDone(true); }
          }, speed);
        }, startDelay);
        return () => { clearTimeout(start); clearInterval(interval); };
      }, [text, speed, startDelay]);
      return { displayed, done };
    }

    // Fixed full-screen video that never autoplays: horizontal mouse movement scrubs it.
    function ScrubVideo() {
      const ref = useRef(null);
      useEffect(() => {
        const v = ref.current;
        let prevX = null, target = 0, seeking = false;
        const seek = () => {
          if (!v.duration) return;
          if (Math.abs(v.currentTime - target) < 0.01) { seeking = false; return; }
          seeking = true; v.currentTime = target;
        };
        const onSeeked = () => { seeking = false; if (Math.abs(v.currentTime - target) > 0.01) seek(); };
        const onMove = (e) => {
          if (prevX === null) { prevX = e.clientX; return; }
          const delta = e.clientX - prevX; prevX = e.clientX;
          if (!v.duration) return;
          target = Math.min(v.duration, Math.max(0, target + (delta / window.innerWidth) * SENSITIVITY * v.duration));
          if (!seeking) seek();
        };
        v.addEventListener('seeked', onSeeked);
        window.addEventListener('mousemove', onMove);
        return () => { v.removeEventListener('seeked', onSeeked); window.removeEventListener('mousemove', onMove); };
      }, []);
      return <video ref={ref} muted playsInline preload="auto" src={VIDEO} style={{ position: 'fixed', inset: 0, zIndex: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: '70% center' }} />;
    }

    const LINKS = ['Labs', 'Studio', 'Openings', 'Shop'];
    function Navbar() {
      const [open, setOpen] = useState(false);
      const bar = 'w-6 h-[2px] bg-black transition-all duration-300';
      return (
        <>
          <header className="fixed top-0 inset-x-0 px-5 sm:px-8 py-4 sm:py-5 flex flex-row justify-between items-center" style={{ zIndex: 10 }}>
            <a href="#" className="flex flex-row items-center gap-3 text-black">
              <span className="text-[21px] sm:text-[26px] tracking-tight" style={{ fontFamily: 'var(--font-heading)' }}>Mainframe®</span>
              <span className="text-[25px] sm:text-[30px] select-none leading-none" style={{ letterSpacing: '-0.02em' }}>✳︎</span>
            </a>
            <nav className="hidden md:flex flex-row text-[23px] text-black">
              {LINKS.map((l, i) => (
                <React.Fragment key={l}>
                  <a href="#" className="hover:opacity-60 transition-opacity">{l}</a>
                  {i < LINKS.length - 1 && <span>,&nbsp;</span>}
                </React.Fragment>
              ))}
            </nav>
            <a href="#" className="hidden md:inline text-[23px] text-black underline underline-offset-2 hover:opacity-60 transition-opacity">Get in touch</a>
            <button aria-label="Menu" aria-expanded={open} onClick={() => setOpen((o) => !o)} className="md:hidden flex flex-col gap-[5px] p-1 relative" style={{ zIndex: 11 }}>
              <span className={bar + (open ? ' rotate-45 translate-y-[7px]' : '')} />
              <span className={bar + (open ? ' opacity-0' : '')} />
              <span className={bar + (open ? ' -rotate-45 -translate-y-[7px]' : '')} />
            </button>
          </header>
          <div className="md:hidden fixed inset-0 bg-white/95 backdrop-blur-sm flex flex-col justify-center items-start px-8 gap-8 transition-opacity duration-300"
            style={{ zIndex: 9, opacity: open ? 1 : 0, pointerEvents: open ? 'auto' : 'none' }}>
            {LINKS.map((l) => <a key={l} href="#" className="text-[32px] font-medium text-black" onClick={() => setOpen(false)}>{l}</a>)}
            <a href="#" className="text-[32px] font-medium text-black underline underline-offset-2">Get in touch</a>
          </div>
        </>
      );
    }

    const CopyIcon = () => (
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.2"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.2" /><path d="M8.5 3.5V2.2A1.2 1.2 0 0 0 7.3 1H2.2A1.2 1.2 0 0 0 1 2.2v5.1a1.2 1.2 0 0 0 1.2 1.2h1.3" /></svg>
    );

    const PILLS = ['Pitch us an idea', 'Come work here', 'Send a brief hello', 'See how we operate'];
    const pill = 'inline-flex items-center justify-center rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] whitespace-nowrap transition-colors duration-200';

    function Hero() {
      const { displayed, done } = useTypewriter('Glad you stopped in. Good taste tends to find us. Now, what are we building?');
      const [shown, setShown] = useState(false);
      const [copied, setCopied] = useState(false);
      useEffect(() => { const t = setTimeout(() => setShown(true), 400); return () => clearTimeout(t); }, []);
      const copy = () => {
        navigator.clipboard?.writeText(EMAIL).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1600); }).catch(() => {});
      };
      const type = { fontSize: 'clamp(18px, 4vw, 26px)', fontWeight: 400, color: '#000' };
      return (
        <section className="relative h-screen flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 overflow-hidden" style={{ zIndex: 1 }}>
          <div className="max-w-xl relative z-10">
            <p className="pointer-events-none select-none mb-5 sm:mb-6" style={{ ...type, lineHeight: 1.3, filter: 'blur(4px)' }}>
              Hey there, meet A.R.I.A,<br />Mainframe's Adaptive Response Interface Agent
            </p>
            <p className="mb-5 sm:mb-6" style={{ ...type, lineHeight: 1.35, minHeight: 54 }}>
              {displayed}
              {!done && <span className="inline-block w-[2px] h-[1.1em] bg-black align-middle ml-[2px] cursor-blink" />}
            </p>
            <div className="flex flex-wrap gap-y-1" style={{ opacity: shown ? 1 : 0, transform: shown ? 'none' : 'translateY(8px)', transition: 'opacity 0.4s ease, transform 0.4s ease' }}>
              {PILLS.map((p) => (
                <button key={p} type="button" className={pill + ' bg-white text-black border border-black/10 hover:bg-black hover:text-white'}>{p}</button>
              ))}
              <button type="button" onClick={copy} className={pill + ' gap-2 sm:gap-3 text-white bg-transparent border border-white hover:bg-white hover:text-black'}>
                <span>{copied ? 'Copied to clipboard' : <>Reach us: <span className="underline underline-offset-1">{EMAIL}</span></>}</span>
                <CopyIcon />
              </button>
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<><ScrubVideo /><Navbar /><Hero /></>);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
