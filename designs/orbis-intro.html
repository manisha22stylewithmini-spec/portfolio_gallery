<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Intro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Condiment&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { grotesk: ['Anton', 'sans-serif'], condiment: ['Condiment', 'cursive'] },
          colors: { cream: '#EFF4FF', neon: '#6FFF00' },
        },
      },
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    html, body { margin: 0; background: #010828; }
    /* die-cut sticker outline, so the black script stays readable on the dark scene */
    .logo-sticker {
      height: 64px; width: auto; display: block; transform: rotate(-2deg); transform-origin: left center;
      filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 8px 14px rgba(0,0,0,.45));
    }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.85);
      padding: 6px 12px; border-radius: 999px; text-decoration: none;
      background: rgba(0,0,0,.45); backdrop-filter: blur(6px);
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const COPY = 'A product designer and UX researcher, turning messy ideas into clean, playful interfaces that feel human.';
    // the faint lines behind the scene: what I do, in my words (skills and strengths only)
    const GHOST = [
      'Three years of product design across SaaS and B2B platforms, from the first sketch to the final handoff.',
      'A psychology background shapes my research, so every decision starts with how people actually behave.',
      'Figma design systems and tidy handoffs that help whole teams move faster, with fewer back-and-forths.',
      'AI to explore faster, humans to decide: MVPs delivered 25 to 30 percent quicker, with the human touch intact.',
    ];
    const ghost = 'font-mono text-[14px] sm:text-[15px] md:text-[16px] uppercase lg:text-cream text-[#010828] opacity-10 leading-relaxed';

    function App() {
      return (
        <section className="relative overflow-hidden min-h-screen">
          <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover">
            <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260331_151551_992053d1-3d3e-4b8c-abac-45f22158f411.mp4" type="video/mp4" />
          </video>

          <div className="relative max-w-[1831px] mx-auto px-4 sm:px-6 md:px-8 py-16 sm:py-20 md:py-24 z-10">
            <div className="flex flex-col lg:flex-row justify-between items-start gap-8 lg:gap-12 mb-12 sm:mb-16 md:mb-20">
              <h2 className="font-grotesk text-[32px] sm:text-[48px] md:text-[60px] font-normal uppercase leading-[1.05] sm:leading-[1] md:leading-[1] text-cream relative">
                Hello!<br />
                I'm Manisha
                <span className="font-condiment text-[36px] sm:text-[52px] md:text-[68px] font-normal normal-case text-neon mix-blend-exclusion leading-[0.79] tracking-[0.03em] absolute right-[-8px] bottom-[-20px] sm:bottom-[-30px] md:bottom-[-40px] -rotate-1 opacity-90">
                  Baroliya
                </span>
              </h2>
              <div className="flex flex-col items-start gap-5 max-w-[266px]">
                <img src="assets/logo-wide.webp" alt="Manisha Baroliya" width="360" height="186" className="logo-sticker" />
                <p className="font-mono text-[14px] sm:text-[15px] md:text-[16px] uppercase text-cream leading-relaxed">{COPY}</p>
              </div>
            </div>

            <div className="flex justify-between items-start">
              <div className="flex flex-col gap-5 max-w-[335px]">
                <p className={ghost}>{GHOST[0]}</p>
                <p className={ghost}>{GHOST[1]}</p>
              </div>
              <div className="hidden lg:flex flex-col gap-5 max-w-[335px]">
                <p className={ghost}>{GHOST[2]}</p>
                <p className={ghost}>{GHOST[3]}</p>
              </div>
            </div>
          </div>
        </section>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
