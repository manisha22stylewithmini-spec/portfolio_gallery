<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Design POV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      ink: '#0C0A09', cream: '#E8E0D0', copper: '#B87333', fog: 'rgba(232, 224, 208, 0.55)',
    } } } };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif; background: #0C0A09; }
    .font-fraunces { font-family: 'Fraunces', 'Times New Roman', serif; font-optical-sizing: auto; }
    @keyframes hero-letter-rise { 0% { opacity: 0; transform: translateY(38px); filter: blur(10px); } 100% { opacity: 1; transform: translateY(0); filter: blur(0); } }
    @keyframes hero-fade-up { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes scroll-cue { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
    .anim-letter { opacity: 0; animation: hero-letter-rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-fade-up { opacity: 0; animation: hero-fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .cue { animation: scroll-cue 2.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .anim-letter, .anim-fade-up, .cue { animation: none !important; opacity: 1 !important; } }
    .scene { opacity: 0; visibility: hidden; will-change: transform, opacity, filter; }
    .shade { text-shadow: 0 2px 28px rgba(12, 10, 9, 0.6), 0 0 2px rgba(12, 10, 9, 0.25); }
    /* die-cut sticker outline, so the black script stays readable over the footage */
    .logo-sticker {
      height: 48px; width: auto; display: block;
      filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.3));
    }
    @media (min-width: 640px) { .logo-sticker { height: 54px; } }
    .back-link { position: fixed; left: 12px; bottom: 12px; z-index: 200; font: 12px system-ui, sans-serif; color: #0C0A09; padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(232,224,208,.85); backdrop-filter: blur(6px); }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const focusRing = ' focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-copper';
    const RADIUS = 140, PULL = 18, LERP = 0.12, IDLE_MS = 1200;

    const VIDEO = 'assets/pov/journey.mp4', POSTER = 'assets/pov/journey.webp';
    const SCREENS = 9;                          // the page is this many screens tall; the video scrubs across all of it
    const SOCIAL = 'shelf-library.html#social'; // every sticker on the social calendar opens a chat with me
    const WORK = 'shelf-library.html#library';
    const POV_AT = 0.93;                        // scroll position of the "design POV" scene

    function usePrefersReducedMotion() {
      const [reduced, setReduced] = useState(() => window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      useEffect(() => {
        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        const on = () => setReduced(mq.matches);
        mq.addEventListener('change', on);
        return () => mq.removeEventListener('change', on);
      }, []);
      return reduced;
    }

    // Each letter: outer span animates in (CSS), inner span is pulled by the RAF loop (inline transform only).
    function MagneticWord({ text, children }) {
      const box = useRef(null);
      const inner = useRef([]);
      const reduced = usePrefersReducedMotion();
      useEffect(() => {
        if (reduced) { inner.current.forEach((el) => el && (el.style.transform = 'translate3d(0,0,0)')); return; }
        const el = box.current;
        let centres = [], w = 0, h = 0, raf = 0;
        const cur = inner.current.map(() => ({ x: 0, y: 0 }));
        const pointer = { x: 0, y: 0, active: false, last: -Infinity };
        const start = performance.now();
        const measure = () => {
          w = el.offsetWidth; h = el.offsetHeight;
          centres = inner.current.map((s) => { const o = s.parentElement; return { x: o.offsetLeft + o.offsetWidth / 2, y: o.offsetTop + o.offsetHeight / 2 }; });
        };
        const setFrom = (cx, cy) => { const r = el.getBoundingClientRect(); pointer.x = cx - r.left; pointer.y = cy - r.top; pointer.active = true; pointer.last = performance.now(); };
        const onMouse = (e) => setFrom(e.clientX, e.clientY);
        const onTouch = (e) => { const t = e.touches[0]; if (t) setFrom(t.clientX, t.clientY); };
        const onLeave = () => { pointer.active = false; };
        const frame = (now) => {
          const idle = !pointer.active || now - pointer.last > IDLE_MS;
          const t = (now - start) / 1000;
          const ax = idle ? w * (0.5 + 0.42 * Math.sin(t * 0.7)) : pointer.x;
          const ay = idle ? h * (0.5 + 0.22 * Math.sin(t * 1.3)) : pointer.y;
          for (let i = 0; i < centres.length; i++) {
            const dx = ax - centres[i].x, dy = ay - centres[i].y, d = Math.hypot(dx, dy);
            let tx = 0, ty = 0;
            if (d < RADIUS && d > 0.001) { const m = Math.min(PULL, ((RADIUS - d) / RADIUS) * PULL); tx = (dx / d) * m; ty = (dy / d) * m; }
            cur[i].x += (tx - cur[i].x) * LERP; cur[i].y += (ty - cur[i].y) * LERP;
            const s = inner.current[i];
            if (s) s.style.transform = `translate3d(${cur[i].x.toFixed(2)}px, ${cur[i].y.toFixed(2)}px, 0)`;
          }
          raf = requestAnimationFrame(frame);
        };
        measure();
        document.fonts && document.fonts.ready.then(measure);
        window.addEventListener('resize', measure);
        window.addEventListener('mousemove', onMouse);
        window.addEventListener('touchmove', onTouch, { passive: true });
        document.documentElement.addEventListener('mouseleave', onLeave);
        raf = requestAnimationFrame(frame);
        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', measure);
          window.removeEventListener('mousemove', onMouse);
          window.removeEventListener('touchmove', onTouch);
          document.documentElement.removeEventListener('mouseleave', onLeave);
        };
      }, [reduced, text]);
      const chars = [...text];
      return (
        <span ref={box} className="relative inline-block">
          {chars.map((c, i) => (
            <span key={i} aria-hidden="true" className="anim-letter inline-block relative" style={{ animationDelay: `${i * 80}ms` }}>
              <span ref={(n) => (inner.current[i] = n)} className="inline-block will-change-transform">{c}</span>
              {i === chars.length - 1 && children}
            </span>
          ))}
        </span>
      );
    }

    const ArrowUpRight = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 7h10v10M7 17 17 7" /></svg>
    );

    // the "booking" label + button, used in the hero and again at the end of the journey
    function Cta({ delay }) {
      return (
        <div className="flex flex-col items-center gap-4 anim-fade-up" style={{ animationDelay: delay }}>
          <p className="text-xs uppercase tracking-[0.25em] text-cream/75 shade">Booking winter '26</p>
          <a href={SOCIAL} target="_top" className={'group inline-flex items-center bg-cream text-ink rounded-full pl-5 pr-1 py-1 text-sm font-medium hover:bg-copper hover:text-cream transition-colors duration-300' + focusRing}>
            Start a project
            <span className="w-9 h-9 rounded-full bg-copper flex items-center justify-center ml-3 text-cream transition-transform duration-300 group-hover:rotate-45"><ArrowUpRight /></span>
          </a>
        </div>
      );
    }

    const NAV = [
      { label: 'Work', href: WORK },
      { label: 'Social', href: SOCIAL },
      { label: 'Design POV', pov: true },
    ];
    const goPov = () => window.scrollTo({ top: POV_AT * (document.documentElement.scrollHeight - innerHeight), behavior: 'smooth' });

    function Navbar() {
      const [mounted, setMounted] = useState(false);
      const [open, setOpen] = useState(false);
      useEffect(() => { const r = requestAnimationFrame(() => setMounted(true)); return () => cancelAnimationFrame(r); }, []);
      const item = (n, cls, after) => n.pov
        ? <a key={n.label} href="#pov" onClick={(e) => { e.preventDefault(); after && after(); goPov(); }} className={cls + focusRing}>{n.label}</a>
        : <a key={n.label} href={n.href} target="_top" className={cls + focusRing}>{n.label}</a>;
      return (
        <>
          <nav className={'fixed top-0 left-0 right-0 z-[100] flex items-center justify-between px-5 sm:px-7 py-4 transition-opacity duration-[600ms] delay-200 ' + (mounted ? 'opacity-100' : 'opacity-0')}>
            <a href="#" aria-label="Manisha Baroliya" className={'flex items-center rounded-full' + focusRing}>
              <img src="assets/logo-wide.webp" alt="Manisha Baroliya" width="360" height="186" className="logo-sticker" />
            </a>
            <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 bg-cream/10 backdrop-blur-md border border-cream/15 rounded-full px-2 py-1.5 items-center gap-1">
              {NAV.map((n) => item(n, 'px-4 py-1.5 rounded-full text-sm font-medium text-cream/80 hover:bg-cream/15 hover:text-cream transition-colors'))}
            </div>
            <a href={SOCIAL} target="_top" className={'hidden md:inline-flex bg-cream text-ink text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-copper hover:text-cream transition-colors' + focusRing}>Book a call</a>
            <button onClick={() => setOpen(true)} aria-label="Open menu" className={'md:hidden ml-auto w-9 h-9 rounded-full bg-cream/10 border border-cream/15 grid place-items-center text-cream' + focusRing}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M4 8h16M4 16h16" /></svg>
            </button>
          </nav>
          <div className={'md:hidden fixed inset-0 z-[150] bg-ink/95 backdrop-blur-xl flex flex-col px-7 py-6 transition-opacity duration-300 ' + (open ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none')}>
            <button onClick={() => setOpen(false)} aria-label="Close menu" className={'self-end w-9 h-9 rounded-full border border-cream/20 grid place-items-center text-cream' + focusRing}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
            </button>
            <div className="mt-16 flex flex-col gap-6">
              {NAV.map((n) => item(n, 'font-fraunces text-4xl text-cream', () => setOpen(false)))}
              <a href={SOCIAL} target="_top" className={'mt-6 self-start bg-cream text-ink text-sm font-semibold px-5 py-2.5 rounded-full' + focusRing}>Book a call</a>
            </div>
          </div>
        </>
      );
    }

    // The journey: what I do, told over the footage. Skills and strengths only, no project details.
    // side = where the block sits; at = [fade in, hold from, hold to, fade out] as a share of the scroll.
    const SCENES = [
      { id: 'craft', side: 'left', at: [0.10, 0.14, 0.22, 0.26], eyebrow: '01 · What I do',
        title: <>Product design, <em className="text-copper italic font-normal">end to end.</em></>,
        body: 'Three years of turning complex, multi-role workflows into clean, scalable interfaces, from the first sketch to the final handoff.' },
      { id: 'research', side: 'right', at: [0.22, 0.26, 0.34, 0.38], eyebrow: '02 · Research',
        title: <>Behaviour first, <em className="text-copper italic font-normal">pixels second.</em></>,
        body: 'A psychology background shapes how I research, so every decision starts with how people actually think, act and get stuck.' },
      { id: 'systems', side: 'bottom', at: [0.34, 0.38, 0.46, 0.50], eyebrow: '03 · Design systems',
        title: <>Systems that <em className="text-copper italic font-normal">scale with the team.</em></>,
        body: 'Figma libraries and tidy handoffs that help whole teams move faster, with fewer back-and-forths.' },
      { id: 'flows', side: 'left', at: [0.46, 0.50, 0.58, 0.62], eyebrow: '04 · SaaS & B2B',
        title: <>Complex made <em className="text-copper italic font-normal">calm.</em></>,
        body: 'Dashboards, data-heavy tools and multi-role flows, simplified until the next step is obvious to everyone using them.' },
      { id: 'ai', side: 'right', at: [0.58, 0.62, 0.70, 0.74], eyebrow: '05 · AI-assisted',
        title: <>AI to explore, <em className="text-copper italic font-normal">humans to decide.</em></>,
        body: 'I use AI in early exploration to test ideas faster, trimming MVP turnaround by 25–30% without losing the human touch.' },
      { id: 'tools', side: 'bottom', at: [0.70, 0.74, 0.82, 0.86], eyebrow: '06 · Toolkit',
        title: <>The <em className="text-copper italic font-normal">toolkit.</em></>,
        chips: ['Figma', 'Photoshop', 'Illustrator', 'Spline', 'Rive', 'Framer', 'Notion', 'Zeplin', 'Adobe Firefly', 'Google AI Studio', 'Antigravity', 'Figma Site'] },
      { id: 'pov', side: 'center', at: [0.82, 0.87, 2, 3], eyebrow: 'My design POV', cta: true,   // the last scene stays to the end
        title: <>Good design is felt <em className="text-copper italic font-normal">before it's noticed.</em></>,
        body: 'I design for behaviour first, then make it quietly beautiful, so products feel human and brands look like themselves.' },
    ];
    const SIDE = {
      left:   'items-end sm:items-center justify-start text-left pb-16 sm:pb-0 px-6 sm:px-14 md:px-20',
      right:  'items-end sm:items-center justify-start sm:justify-end text-left pb-16 sm:pb-0 px-6 sm:px-14 md:px-20',
      bottom: 'items-end justify-center text-center pb-16 sm:pb-14 px-6',
      center: 'items-center justify-center text-center px-6',
    };

    // a soft shade on the side the words sit, so small type stays readable over bright footage
    const SCRIM = {
      left: 'linear-gradient(90deg, rgba(12,10,9,.66) 0%, rgba(12,10,9,.3) 42%, transparent 72%)',
      right: 'linear-gradient(270deg, rgba(12,10,9,.66) 0%, rgba(12,10,9,.3) 42%, transparent 72%)',
      bottom: 'linear-gradient(0deg, rgba(12,10,9,.78) 0%, rgba(12,10,9,.35) 42%, transparent 74%)',
      center: 'radial-gradient(ellipse 62% 56% at 50% 50%, rgba(12,10,9,.6), transparent 78%)',
    };
    function Scene({ s, refCb }) {
      const wide = s.side === 'bottom' || s.side === 'center';
      return (
        <div ref={refCb} className={'scene absolute inset-0 z-40 flex pointer-events-none ' + SIDE[s.side]}>
          <div aria-hidden="true" className="absolute inset-0 -z-10" style={{ background: SCRIM[s.side] }} />
          <div className={wide ? 'max-w-[640px]' : 'max-w-[440px]'}>
            <p className="text-xs uppercase tracking-[0.25em] text-cream/55 shade">{s.eyebrow}</p>
            <h2 className="shade mt-3 font-fraunces font-medium text-cream text-[2rem] sm:text-5xl lg:text-6xl leading-[1.02]" style={{ letterSpacing: '-0.035em' }}>{s.title}</h2>
            {s.body && <p className="shade mt-4 text-sm sm:text-base text-cream/80 leading-relaxed">{s.body}</p>}
            {s.chips && (
              <div className="mt-5 flex flex-wrap justify-center gap-2">
                {s.chips.map((c) => <span key={c} className="rounded-full border border-cream/25 bg-ink/35 backdrop-blur-md px-3.5 py-1.5 text-xs sm:text-sm text-cream/90">{c}</span>)}
              </div>
            )}
            {s.cta && <div className="mt-8 flex justify-center"><Cta delay="0s" /></div>}
          </div>
        </div>
      );
    }

    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const ease = (t) => t * t * (3 - 2 * t);

    function Journey() {
      const video = useRef(null), frame = useRef(null), hero = useRef(null), cue = useRef(null), scenes = useRef([]);
      const reduced = usePrefersReducedMotion();

      useEffect(() => {
        const v = video.current;
        let target = 0, cur = 0, raf = 0, ready = false;
        const blur = (px) => (px > 0.15 ? `blur(${px.toFixed(1)}px)` : 'none');

        const paint = (p) => {
          // hero: fades up and out over the first stretch of the scroll
          const h = ease(clamp((p - 0.015) / 0.085));
          const hs = hero.current.style;
          hs.opacity = 1 - h; hs.transform = `translate3d(0, ${-7 * h}vh, 0) scale(${1 + 0.07 * h})`; hs.filter = blur(10 * h);
          hs.visibility = h > 0.98 ? 'hidden' : 'visible'; hs.pointerEvents = h > 0.3 ? 'none' : 'auto';
          cue.current.style.opacity = 1 - clamp(p / 0.03);
          // slow push-in on the footage
          frame.current.style.transform = `scale(${1 + 0.1 * p})`;
          // scenes slide in from their own side, hold, and drift out
          SCENES.forEach((sc, i) => {
            const el = scenes.current[i]; if (!el) return;
            const [a, b, c, d] = sc.at;
            const inn = ease(clamp((p - a) / (b - a))), out = ease(clamp((p - c) / (d - c)));
            const o = inn * (1 - out);
            const dir = sc.side === 'left' ? -1 : sc.side === 'right' ? 1 : 0;
            const x = dir * (30 * (1 - inn) + 24 * out), y = dir === 0 ? 34 * (1 - inn) - 24 * out : 0;
            const st = el.style;
            st.opacity = o; st.visibility = o < 0.01 ? 'hidden' : 'visible';
            st.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`; st.filter = blur((1 - o) * 8);
            st.pointerEvents = o > 0.6 ? 'auto' : 'none';
          });
        };

        const step = () => {
          raf = 0;
          const dur = v.duration;
          if (!ready || !dur) return;
          const want = clamp(target) * (dur - 0.05);
          cur = reduced ? want : cur + (want - cur) * 0.16;
          if (!v.seeking && Math.abs(cur - v.currentTime) > 0.015) v.currentTime = cur;
          // keep going until the easing has arrived AND the video has actually landed on that frame
          if (Math.abs(want - cur) > 0.004 || v.seeking || Math.abs(cur - v.currentTime) > 0.015) raf = requestAnimationFrame(step);
        };
        const onScroll = () => {
          const max = document.documentElement.scrollHeight - innerHeight;
          target = max > 0 ? scrollY / max : 0;
          paint(target);
          if (!raf) raf = requestAnimationFrame(step);
        };
        // iOS only lets a video seek smoothly after it has been "played" once; do that silently, then follow the scroll
        const onReady = () => {
          ready = true;
          const pl = v.play();
          (pl && pl.then ? pl.then(() => v.pause()) : Promise.resolve(v.pause())).catch(() => {}).then(onScroll);
        };
        // a server without byte-range support makes the video unseekable; load it whole as a blob instead (always seekable)
        let swapped = false;
        const begin = () => {
          const last = v.seekable.length - 1;
          const seekable = last >= 0 && v.seekable.end(last) >= v.duration - 0.5;
          if (!seekable && !swapped) {
            swapped = true;
            fetch(VIDEO).then((r) => r.blob()).then((blob) => { v.addEventListener('loadeddata', onReady, { once: true }); v.src = URL.createObjectURL(blob); }).catch(onReady);
            return;
          }
          onReady();
        };
        if (v.readyState >= 2) begin(); else v.addEventListener('loadeddata', begin, { once: true });
        onScroll();
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('resize', onScroll);
        return () => { removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); cancelAnimationFrame(raf); };
      }, [reduced]);

      return (
        <div style={{ height: `${SCREENS * 100}svh` }}>
          <div className="sticky top-0 w-full overflow-hidden bg-ink" style={{ height: '100dvh' }}>
            {/* the footage: scrubbed by scroll, not played */}
            <div ref={frame} className="absolute inset-0 z-10 will-change-transform">
              <video ref={video} src={VIDEO} poster={POSTER} muted playsInline preload="auto" tabIndex={-1} aria-hidden="true" className="h-full w-full object-cover" />
            </div>
            <div className="absolute inset-0 z-20 pointer-events-none bg-ink/40"><div className="absolute inset-0 bg-gradient-to-b from-ink/30 via-transparent to-ink/85" /></div>
            <svg className="absolute inset-0 w-full h-full pointer-events-none mix-blend-overlay opacity-[0.35]" style={{ zIndex: 25 }} aria-hidden="true">
              <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" /></filter>
              <rect width="100%" height="100%" filter="url(#noise)" />
            </svg>

            {/* hero: title, line, and the call to action, all on the centre line */}
            <div ref={hero} className="absolute inset-0 z-40 flex flex-col items-center justify-center text-center px-5 pt-10 will-change-transform">
              <h1 aria-label="Product Design" className="shade font-fraunces font-medium text-cream text-[17vw] sm:text-[14vw] md:text-[10.5vw] lg:text-[9.5vw]" style={{ letterSpacing: '-0.045em', lineHeight: 0.92 }}>
                <MagneticWord text="Product" />{' '}
                <MagneticWord text="Design">
                  <span aria-hidden="true" className="absolute top-[0.15em] -right-[0.1em] text-[0.2em] text-copper">°</span>
                </MagneticWord>
              </h1>
              <p className="shade font-fraunces italic font-normal text-cream/75 text-base sm:text-xl md:text-2xl mt-4 sm:mt-5 anim-fade-up" style={{ animationDelay: '1.1s' }}>
                A product designer &amp; UX researcher crafting experiences that last.
              </p>
              <div className="mt-8 sm:mt-10"><Cta delay="1.4s" /></div>
            </div>

            <div ref={cue} className="absolute bottom-7 left-1/2 -translate-x-1/2 z-40 pointer-events-none">
              <div className="flex flex-col items-center gap-2 anim-fade-up" style={{ animationDelay: '1.8s' }}>
                <span className="text-[10px] uppercase tracking-[0.3em] text-cream/55 shade">Scroll</span>
                <span className="block h-8 w-px bg-cream/50 cue" />
              </div>
            </div>

            {SCENES.map((sc, i) => <Scene key={sc.id} s={sc} refCb={(n) => (scenes.current[i] = n)} />)}
          </div>
        </div>
      );
    }

    function App() {
      return (
        <div className="bg-ink text-cream tracking-[-0.015em]" style={{ fontFamily: "'Inter Tight', sans-serif" }}>
          <Navbar />
          <Journey />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
