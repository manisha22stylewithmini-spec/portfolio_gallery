<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Sound diary</title>
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/a64ff11d2c24584c767f6257e880dc65?family=Helvetica+Regular">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    html { font-family: 'Helvetica Regular', Helvetica, Arial, sans-serif; }
    html, body, #root { margin: 0; height: 100%; background: #000; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }
    .animate-fade-up { animation: fade-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.25s; }
    .delay-3 { animation-delay: 0.4s; }
    .delay-4 { animation-delay: 0.55s; }
    .delay-5 { animation-delay: 0.75s; }
    @media (prefers-reduced-motion: reduce) { .animate-fade-up { animation: none; } }

    /* die-cut sticker outline, so the black script stays readable over the video */
    .logo-sticker {
      height: 52px; width: auto; display: block;
      filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.28));
    }
    @media (min-width: 640px) { .logo-sticker { height: 58px; } }

    /* the playlist: one slim frosted pill, horizontal, bottom-right */
    .player {
      background: rgba(8, 16, 44, .32);
      backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 14px 30px -12px rgba(0,0,0,.45);
    }
    .player.nudge { animation: nudge .9s ease; }
    @keyframes nudge { 0%,100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,.2), 0 14px 30px -12px rgba(0,0,0,.45); } 40% { box-shadow: inset 0 0 0 2px rgba(255,255,255,.85), 0 0 0 6px rgba(255,255,255,.18), 0 14px 30px -12px rgba(0,0,0,.45); } }
    .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .eq i { display: block; width: 2px; height: 30%; border-radius: 1px; background: #fff; }
    .playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
    .playing .eq i:nth-child(2) { animation-delay: -.3s; } .playing .eq i:nth-child(3) { animation-delay: -.6s; }
    @keyframes eq { from { height: 25%; } to { height: 100%; } }
    .play-hint::after { content: ''; position: absolute; inset: -4px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.7); animation: hint 1.8s ease-out infinite; }
    @keyframes hint { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .playing .eq i, .play-hint::after, .player.nudge { animation: none; } }

    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.75);
      padding: 6px 12px; border-radius: 999px; text-decoration: none;
      background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useRef, useEffect } = React;

    // Lucide glyphs (inline)
    const Icon = ({ size = 24, strokeWidth = 2, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;
    // filled transport glyphs
    const Glyph = ({ size = 16, children }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">{children}</svg>;
    const Play = (p) => <Glyph {...p}><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11-6.86a1 1 0 0 0 0-1.7l-11-6.86A1 1 0 0 0 8 5.14Z"/></Glyph>;
    const Pause = (p) => <Glyph {...p}><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></Glyph>;
    const Prev = (p) => <Glyph {...p}><rect x="4.5" y="5" width="2.6" height="14" rx="1.1"/><path d="M19.5 5.9v12.2a.9.9 0 0 1-1.4.75l-8.6-6.1a.9.9 0 0 1 0-1.5l8.6-6.1a.9.9 0 0 1 1.4.75Z"/></Glyph>;
    const Next = (p) => <Glyph {...p}><rect x="16.9" y="5" width="2.6" height="14" rx="1.1"/><path d="M4.5 5.9v12.2a.9.9 0 0 0 1.4.75l8.6-6.1a.9.9 0 0 0 0-1.5L5.9 5.15a.9.9 0 0 0-1.4.75Z"/></Glyph>;

    const VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260611_183632_c311af08-e4b7-458f-81e7-79847a49b3d3.mp4';
    const PAGES = [
      { label: 'Home', href: 'shelf-library.html#home' },
      { label: 'About', href: 'halcyon-hero.html' },          // the design-POV journey tells who I am
      { label: 'Projects', href: 'shelf-library.html#library' },
    ];
    const SOCIAL = 'shelf-library.html#social';   // every sticker on the social calendar opens a chat with me
    // two tracks, audio only (AAC, ~56 kbps); the page loads just the one that's selected
    const TRACKS = [
      { title: 'Stereo Hearts', artist: 'Gym Class Heroes', src: 'assets/audio/stereo-hearts.m4a' },
      { title: 'On The Floor', artist: 'Jennifer Lopez ft. Pitbull', src: 'assets/audio/on-the-floor.m4a' },
    ];
    const fmt = (t) => (isFinite(t) ? `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}` : '0:00');

    function BoomerangVideoBg({ src }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [ready, setReady] = useState(false);

      useEffect(() => {
        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas) return;

        const frames = [];
        let cancelled = false, raf = 0, capturing = false, failed = false;

        const capture = () => {
          if (cancelled || failed || !video.videoWidth) return;
          const scale = Math.min(1, 960 / video.videoWidth);
          const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          try {
            c.getContext('2d').drawImage(video, 0, 0, w, h);
            frames.push(c);
          } catch (e) { // tainted canvas (CORS) — fall back to plain looping
            failed = true;
            video.loop = true;
            video.play();
          }
        };

        const startCapture = () => {
          if (capturing) return;
          capturing = true;
          if ('requestVideoFrameCallback' in video) {
            const tick = () => { capture(); if (!video.ended && !cancelled) video.requestVideoFrameCallback(tick); };
            video.requestVideoFrameCallback(tick);
          } else {
            const tick = () => { capture(); if (!video.ended && !cancelled) raf = requestAnimationFrame(tick); };
            raf = requestAnimationFrame(tick);
          }
        };

        const startBoomerang = () => {
          if (failed || !frames.length) return;
          canvas.width = frames[0].width; canvas.height = frames[0].height;
          const ctx = canvas.getContext('2d');
          let i = 0, dir = 1, last = 0;
          const step = (t) => {
            if (cancelled) return;
            if (t - last >= 1000 / 30) {
              last = t;
              ctx.drawImage(frames[i], 0, 0);
              if (frames.length > 1) {
                if (i + dir >= frames.length || i + dir < 0) dir = -dir;
                i += dir;
              }
            }
            raf = requestAnimationFrame(step);
          };
          setReady(true);
          raf = requestAnimationFrame(step);
        };

        video.addEventListener('play', startCapture);
        video.addEventListener('ended', startBoomerang);
        video.play().catch(() => {});
        return () => { cancelled = true; cancelAnimationFrame(raf); video.removeEventListener('play', startCapture); video.removeEventListener('ended', startBoomerang); };
      }, [src]);

      return (
        <div className="absolute inset-0 z-0 scale-[1.08] origin-center overflow-hidden bg-black">
          <video ref={videoRef} src={src} muted playsInline crossOrigin="anonymous" preload="auto"
            className={`h-full w-full object-cover ${ready ? 'hidden' : ''}`} />
          <canvas ref={canvasRef} className={`h-full w-full object-cover ${ready ? '' : 'hidden'}`} />
        </div>
      );
    }

    function Player() {
      const audio = useRef(null);
      const [idx, setIdx] = useState(0);
      const [playing, setPlaying] = useState(false);
      const [cur, setCur] = useState(0);
      const [dur, setDur] = useState(0);
      const wantPlay = useRef(false);
      const t = TRACKS[idx];

      const toggle = () => {
        const a = audio.current;
        if (a.paused) { wantPlay.current = true; a.play().catch(() => {}); } else { wantPlay.current = false; a.pause(); }
      };
      const go = (d) => { wantPlay.current = wantPlay.current || playing; setIdx((i) => (i + d + TRACKS.length) % TRACKS.length); };
      const seek = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        if (dur) audio.current.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * dur;
      };

      // a new track loads and keeps playing if the last one was
      useEffect(() => {
        const a = audio.current;
        a.src = TRACKS[idx].src; setCur(0); setDur(0);
        if (wantPlay.current) a.play().catch(() => {});
        if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[idx].title, artist: TRACKS[idx].artist });
      }, [idx]);
      useEffect(() => {
        if (!('mediaSession' in navigator)) return;
        navigator.mediaSession.setActionHandler('play', toggle); navigator.mediaSession.setActionHandler('pause', toggle);
        navigator.mediaSession.setActionHandler('previoustrack', () => go(-1)); navigator.mediaSession.setActionHandler('nexttrack', () => go(1));
      });
      useEffect(() => {   // "Sound diary" in the menu nudges the player
        const nudge = () => { const el = document.getElementById('player'); el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge'); };
        addEventListener('nudge-player', nudge); return () => removeEventListener('nudge-player', nudge);
      }, []);

      const btn = 'flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-white hover:bg-white/15 active:scale-90 transition';
      return (
        <div className="absolute z-20 bottom-14 sm:bottom-6 md:bottom-8 left-0 right-0 flex justify-center px-4 pointer-events-none">
        <div id="player" className={`player ${playing ? 'playing' : ''} animate-fade-up delay-5 pointer-events-auto w-full sm:w-[440px] rounded-full pl-1.5 pr-4 py-1.5 flex items-center gap-1.5 text-white`}>
          <audio ref={audio} preload="metadata"
            onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
            onTimeUpdate={(e) => setCur(e.currentTarget.currentTime)}
            onLoadedMetadata={(e) => setDur(e.currentTarget.duration)}
            onEnded={() => { wantPlay.current = true; setIdx((i) => (i + 1) % TRACKS.length); }} />

          <button onClick={() => go(-1)} aria-label="Previous track" className={btn}><Prev size={15} /></button>
          <button onClick={toggle} aria-label={playing ? 'Pause' : 'Play'}
            className={`relative flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white text-gray-900 active:scale-90 transition ${playing || cur > 0 ? '' : 'play-hint'}`}>
            {playing ? <Pause size={16} /> : <Play size={16} />}
          </button>
          <button onClick={() => go(1)} aria-label="Next track" className={btn}><Next size={15} /></button>

          <div className="ml-1.5 min-w-0 flex-1">
            <div className="flex items-center gap-2">
              <span className="eq" aria-hidden="true"><i /><i /><i /></span>
              <p className="truncate text-[13px] leading-tight">{t.title}<span className="text-white/60"> · {t.artist}</span></p>
              <span className="ml-auto text-[10px] tabular-nums text-white/70">{fmt(cur)}</span>
            </div>
            <div onClick={seek} className="mt-1.5 h-1.5 cursor-pointer rounded-full bg-white/25" role="progressbar" aria-label="Seek" aria-valuemin={0} aria-valuemax={Math.round(dur)} aria-valuenow={Math.round(cur)}>
              <div className="h-full rounded-full bg-white" style={{ width: dur ? `${(cur / dur) * 100}%` : '0%' }} />
            </div>
          </div>
        </div>
        </div>
      );
    }

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const tt = 'transition-transform duration-200';
      const diary = (e) => { e.preventDefault(); setMenuOpen(false); dispatchEvent(new Event('nudge-player')); };

      return (
        <div className="relative h-screen w-full overflow-hidden">
          <BoomerangVideoBg src={VIDEO} />

          <header className="absolute top-0 left-0 right-0 z-20">
            <div className="relative flex items-center justify-between px-4 py-3 sm:px-6 sm:py-4 md:px-10">
              <a href="#" aria-label="Manisha Baroliya">
                <img src="assets/logo-wide.webp" alt="Manisha Baroliya" width="360" height="186" className="logo-sticker" />
              </a>

              <nav className="hidden md:flex items-center gap-6 lg:gap-9 md:absolute md:left-1/2 md:-translate-x-1/2">
                {PAGES.map((l) => <a key={l.label} href={l.href} target="_top" className="text-sm text-white/90 hover:text-white">{l.label}</a>)}
                <a href="#player" onClick={diary} className="text-sm text-white/90 hover:text-white">Sound diary</a>
                <a href={SOCIAL} target="_top" className="text-sm text-white/90 hover:text-white">Social</a>
              </nav>

              <button onClick={() => setMenuOpen(!menuOpen)} aria-label="Toggle menu"
                className={`liquid-glass md:hidden flex h-9 w-9 items-center justify-center rounded-xl text-white ${tt}`}>
                {menuOpen ? <X size={18} /> : <Menu size={18} />}
              </button>
            </div>

            {menuOpen && (
              <div className="liquid-glass md:hidden mx-4 rounded-2xl p-2">
                {PAGES.map((l) => <a key={l.label} href={l.href} target="_top" className="block rounded-xl px-4 py-3 text-sm text-white/90 hover:bg-white/10">{l.label}</a>)}
                <a href="#player" onClick={diary} className="block rounded-xl px-4 py-3 text-sm text-white/90 hover:bg-white/10">Sound diary</a>
                <a href={SOCIAL} target="_top" className="block rounded-xl px-4 py-3 text-sm text-white/90 hover:bg-white/10">Social</a>
              </div>
            )}
          </header>

          <main className="relative z-10 flex h-full flex-col items-center px-4 pt-28 text-center sm:px-6 sm:pt-36 md:pt-44">
            <div className="animate-fade-up delay-1 liquid-glass mb-5 sm:mb-6 rounded-lg px-4 py-1.5 text-xs sm:text-sm text-white" style={{ background: 'rgba(255, 255, 255, 0.16)' }}>
              Press 04 . Vernal woods
            </div>
            <h1 className="animate-fade-up delay-2 max-w-3xl text-4xl sm:text-5xl md:text-6xl lg:text-7xl leading-[1.1] text-white">
              records cut for the<br />calm listener.
            </h1>
            <p className="animate-fade-up delay-3 mt-5 sm:mt-6 max-w-md text-sm sm:text-base md:text-lg leading-relaxed text-white/90">
              Drone, roots, and nature-captured sound on wax LPs. Every disc cut just once, snag it or miss.
            </p>
            <div className="animate-fade-up delay-4 mt-8 flex flex-col sm:flex-row gap-3">
              <button className={`rounded-xl bg-white px-7 py-2.5 text-sm text-gray-900 hover:scale-105 active:scale-95 ${tt}`}>Browse the shelves</button>
              <button className={`liquid-glass rounded-xl px-7 py-2.5 text-sm text-white hover:scale-105 active:scale-95 ${tt}`}>Newest arrivals</button>
            </div>
          </main>

          <Player />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
