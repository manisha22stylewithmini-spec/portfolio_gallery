    /* paper grain */

    header.bar { position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px clamp(18px,4vw,56px); }
    .bar img { height:50px; width:auto; display:block; }
    .bar nav { display:none; gap:34px; font-family:'Cormorant SC',serif; font-size:19px; font-weight:600; letter-spacing:.06em; }
    .bar nav a { color:var(--ink2); transition:color .2s; }
    .bar nav a:hover { color:var(--ink); }
    .pill { border:1.5px solid var(--ink); border-radius:999px; padding:8px 22px; font:600 18px 'Cormorant SC',serif; letter-spacing:.05em; transition:background .2s, color .2s; }
    .pill:hover { background:var(--ink); color:var(--paper); }
    @media (min-width:820px) { .bar nav { display:flex; } }

    .stage { position:relative; flex:1; min-height:0; }
    .roof { position:absolute; left:50%; top:6px; width:min(820px, 96vw); transform:translateX(-50%); z-index:3; pointer-events:none; will-change:transform; filter:drop-shadow(0 14px 14px rgba(40,30,20,.25)); }

    .cap { position:relative; z-index:6; display:flex; align-items:center; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; padding:0 clamp(18px,4vw,56px) 58px; }
    .cap p { margin:0; font-size:clamp(18px,2.1vw,25px); line-height:1.25; font-weight:600; }
    .cap p span { color:var(--ink2); font-weight:500; }
    .cap a { font:600 19px 'Cormorant SC',serif; letter-spacing:.06em; border-bottom:1.5px solid var(--ink); padding-bottom:2px; white-space:nowrap; }
    .back-link { position:fixed; left:12px; bottom:12px; z-index:60; font:12px system-ui,sans-serif; color:#fff; padding:6px 12px; border-radius:999px; background:rgba(60,45,30,.7); }
    .embed .back-link { display:none !important; }

  <script>
  (function () {
    // A hanging scroll of letters. The cursor parts it like a curtain: below the pointer the letters are pushed
    // aside (the nearest ones travel furthest, so they bunch at the edges) and the bottom rows curl up and out.
    var ROWS_TXT = ['PSYCHOLOGYFIRST', 'DESIGNFORPEOPLE', 'UXRESEARCHCRAFT', 'CALMHUMANDESIGN'];
    var COLS = 15;
    var stage = document.getElementById('stage'), cv = document.getElementById('scroll'), ctx = cv.getContext('2d'), roof = document.getElementById('roof');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var W = 0, H = 0, dpr = 1, colW = 24, rowH = 27, left = 0, top = 0, rows = 20;
    var m = { x: 0, y: 0, on: false, last: -1e9 }, cur = { x: 0, y: 0, amp: 0 }, roofX = 0;
    function smooth(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
    function layout() {
      var r = stage.getBoundingClientRect(); W = r.width; H = r.height; dpr = Math.min(devicePixelRatio || 1, 2);
      cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      colW = Math.max(18, Math.min(34, W * 0.036)); rowH = colW * 1.04;
      var rr = roof.getBoundingClientRect(), roofB = rr.top - r.top + rr.height * 0.9;
      top = Math.max(60, roofB); left = (W - COLS * colW) / 2;
      rows = Math.max(6, Math.floor((H - top - 8) / rowH));
      if (!m.on) { cur.x = W / 2; cur.y = top + rows * rowH * 0.3; }
    }
    function point(e) { var r = stage.getBoundingClientRect(); m.x = e.clientX - r.left; m.y = e.clientY - r.top; m.on = true; m.last = performance.now(); }
    addEventListener('pointermove', point); addEventListener('pointerdown', point);
    document.documentElement.addEventListener('mouseleave', function () { m.on = false; });
    function frame(now) {
      requestAnimationFrame(frame);
      var t = now / 1000, tx, ty, ta;
      var idle = !m.on || now - m.last > 3200;
      if (reduce) { tx = W / 2; ty = top + rows * rowH * 0.35; ta = 0.0; }
      else if (idle) { tx = W / 2 + Math.sin(t * 0.55) * colW * 4.2; ty = top + rows * rowH * (0.34 + 0.12 * Math.sin(t * 0.37)); ta = 0.8; }
      else { tx = m.x; ty = m.y; ta = 1; }
      cur.x += (tx - cur.x) * 0.12; cur.y += (ty - cur.y) * 0.12; cur.amp += (ta - cur.amp) * 0.08;
      roofX += (((cur.x - W / 2) / W) * 34 - roofX) * 0.08; roof.style.transform = 'translateX(calc(-50% + ' + roofX.toFixed(2) + 'px))';
      ctx.clearRect(0, 0, W, H);
      ctx.font = '700 ' + (colW * 1.12).toFixed(1) + 'px "Cormorant Garamond", Georgia, serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#4a3b2c';
      var sig = colW * 3.1, A = cur.amp;
      for (var j = 0; j < rows; j++) {
        var jf = j / Math.max(1, rows - 1), line = ROWS_TXT[j % ROWS_TXT.length], y0 = top + (j + 0.5) * rowH;
        var vy = smooth((y0 - (cur.y - rowH * 1.5)) / (rowH * 8));
        for (var i = 0; i < COLS; i++) {
          var x0 = left + (i + 0.5) * colW, d = x0 - cur.x, ad = Math.abs(d);
          var k = Math.exp(-(d * d) / (2 * sig * sig)), dirn = d >= 0 ? 1 : -1;
          var push = A * vy * k * colW * 1.45, curl = A * vy * k * Math.pow(jf, 3);
          var x = x0 + dirn * (push + curl * colW * 1.9);
          var y = y0 - curl * rowH * 2.1;
          var rot = dirn * (push / colW) * 0.1 + dirn * curl * 0.5;
          ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = 0.9 - 0.18 * Math.min(1, push / colW);
          ctx.fillText(line[i], 0, 0); ctx.restore();
        }
      }
    }
    new ResizeObserver(layout).observe(stage);
    (document.fonts && document.fonts.load ? document.fonts.load('700 20px "Cormorant Garamond"') : Promise.resolve()).then(function () { layout(); requestAnimationFrame(frame); });
  })();
  </script>
