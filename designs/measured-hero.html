<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Measured — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { theme: { extend: { screens: { xs: '420px' } } } };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    /* Helvetica Neue Roman is not bundled in this library; falls back to the system Helvetica Neue. */
    * { font-family: 'Inter', sans-serif; }
    .font-helvetica-neue, .font-helvetica-neue * { font-family: 'Helvetica Neue', Helvetica, 'Inter', sans-serif; }
    .serif-hero { font-family: 'Instrument Serif', serif !important; }
    body { margin: 0; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 70;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.85);
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    const BG_IMAGE = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260713_140344_79e1296a-86d7-43fd-9b5f-63ffe560f291.png&w=1280&q=85';
    const FRONT_VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_162101_0d7498c5-29bb-47bf-a99f-2773c0a880a9.mp4';
    const OVERLAY = 'https://soft-zoom-63098134.figma.site/_assets/v11/3f10f1876e118f72a396e05a6c2d099569478272.png';
    const NAV = ['Device', 'Real Stories', 'Science', 'Plans', 'Reach Us'];
    const RADIUS = 260;

    const Logo = () => (
      <svg width="28" height="28" viewBox="0 0 256 256" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M 256 64 L 256 128 L 192.5 128 L 160 95 L 128 64 L 96 95 L 63.5 128 L 64 128 L 128 192 L 128 256 L 64.5 256 L 32 223 L 0 192 L 0 64 L 64 0 L 192 0 Z M 256 192 L 256 256 L 192.5 256 L 160 223 L 128 192 L 128 128 L 192 128 Z" />
      </svg>
    );
    const Cta = ({ className = '' }) => (
      <button className={`liquid-glass rounded-full px-5 py-2.5 text-white text-sm font-medium flex items-center gap-2 ${className}`}>
        <span className="w-2 h-2 rounded-full bg-green-400" />Reserve Yours
      </button>
    );

    function Hero() {
      const sectionRef = useRef(null);
      const maskRef = useRef(null);
      const gridRef = useRef(null);

      useEffect(() => {
        const sec = sectionRef.current;
        const SCALE = 0.25; // mask canvas resolution relative to the viewport
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const target = { x: innerWidth / 2, y: innerHeight * 0.7 };
        const smooth = { ...target };
        const grid = { x: 0, y: 0 };
        let raf = 0;

        const onMove = (e) => { const r = sec.getBoundingClientRect(); target.x = e.clientX - r.left; target.y = e.clientY - r.top; };
        sec.addEventListener('pointermove', onMove);

        const draw = () => {
          const w = sec.clientWidth, h = sec.clientHeight;
          const cw = Math.max(1, Math.round(w * SCALE)), ch = Math.max(1, Math.round(h * SCALE));
          if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
          smooth.x += (target.x - smooth.x) * 0.1;
          smooth.y += (target.y - smooth.y) * 0.1;
          ctx.clearRect(0, 0, cw, ch);
          const g = ctx.createRadialGradient(smooth.x * SCALE, smooth.y * SCALE, 0, smooth.x * SCALE, smooth.y * SCALE, RADIUS * SCALE);
          g.addColorStop(0, 'rgba(255,255,255,1)');
          g.addColorStop(0.4, 'rgba(255,255,255,1)');
          g.addColorStop(0.6, 'rgba(255,255,255,0.75)');
          g.addColorStop(0.75, 'rgba(255,255,255,0.4)');
          g.addColorStop(0.88, 'rgba(255,255,255,0.12)');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, cw, ch);
          const url = `url(${canvas.toDataURL()})`;
          const m = maskRef.current;
          m.style.webkitMaskImage = url; m.style.maskImage = url;

          grid.x += ((smooth.x - w / 2) * 16 / (w / 2) - grid.x) * 0.06;
          grid.y += ((smooth.y - h / 2) * 16 / (h / 2) - grid.y) * 0.06;
          gridRef.current.style.transform = `translate(${grid.x}px, ${grid.y}px)`;
          raf = requestAnimationFrame(draw);
        };
        raf = requestAnimationFrame(draw);
        return () => { cancelAnimationFrame(raf); sec.removeEventListener('pointermove', onMove); };
      }, []);

      return (
        <section ref={sectionRef} className="font-helvetica-neue relative h-screen w-full overflow-hidden bg-black">
          <div className="absolute z-0 opacity-10 pointer-events-none" style={{ inset: '-24px' }}>
            <svg ref={gridRef} width="100%" height="100%">
              <defs>
                <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
                  <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#64748b" strokeWidth="0.6" />
                </pattern>
              </defs>
              <rect width="100%" height="100%" fill="url(#grid)" />
            </svg>
          </div>

          <div className="absolute inset-0 z-10 bg-center bg-cover bg-no-repeat" style={{ backgroundImage: `url("${BG_IMAGE}")` }} />

          <h1 className="serif-hero absolute z-20 left-0 right-0 top-20 sm:top-28 md:top-32 text-center uppercase text-white leading-[0.9] text-[4.5rem] xs:text-[5.5rem] sm:text-[10rem] md:text-[13rem] lg:text-[16rem] pointer-events-none">
            Measured
          </h1>

          <img src={OVERLAY} alt="" className="absolute inset-0 z-[25] w-full h-full object-cover pointer-events-none" />

          <div ref={maskRef} className="absolute inset-0 z-30 pointer-events-none"
            style={{ WebkitMaskSize: '100% 100%', maskSize: '100% 100%', WebkitMaskRepeat: 'no-repeat', maskRepeat: 'no-repeat' }}>
            <video src={FRONT_VIDEO} autoPlay loop muted playsInline className="w-full h-full object-cover" style={{ clipPath: 'inset(40% 0 0 0)' }} />
          </div>
        </section>
      );
    }

    function App() {
      const [open, setOpen] = useState(false);
      useEffect(() => { document.body.style.overflow = open ? 'hidden' : ''; }, [open]);
      const ease = 'cubic-bezier(0.77, 0, 0.18, 1)';
      const item = (i) => ({
        transition: `opacity 600ms ${ease} ${100 + i * 60}ms, transform 600ms ${ease} ${100 + i * 60}ms`,
        opacity: open ? 1 : 0, transform: open ? 'translateY(0)' : 'translateY(24px)',
      });

      return (
        <div className="bg-white">
          <header className="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-5 sm:px-8 py-5 pointer-events-none">
            <div className="pointer-events-auto"><Logo /></div>
            <nav className="hidden md:flex liquid-glass rounded-full px-2 py-1.5 absolute left-1/2 -translate-x-1/2 pointer-events-auto">
              {NAV.map((n) => <button key={n} className="text-white/70 hover:text-white text-sm font-medium rounded-full px-4 py-2 transition-colors">{n}</button>)}
            </nav>
            <div className="hidden md:block pointer-events-auto"><Cta /></div>
            <button onClick={() => setOpen(true)} aria-label="Open menu" className="md:hidden liquid-glass rounded-full px-4 py-3 flex flex-col items-end gap-1.5 pointer-events-auto">
              <span className="block w-5 h-[1.5px] bg-white" /><span className="block w-3.5 h-[1.5px] bg-white" />
            </button>
          </header>

          <div className={`fixed inset-0 z-[55] md:hidden flex flex-col items-center justify-center gap-6 transition-opacity duration-500 ${open ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} style={{ background: '#0a0a0a' }}>
            <button onClick={() => setOpen(false)} aria-label="Close menu"
              className="liquid-glass rounded-full w-12 h-12 absolute top-5 right-5 flex items-center justify-center"
              style={{ transition: `transform 500ms ${ease}, opacity 500ms ${ease}`, transform: open ? 'rotate(0) scale(1)' : 'rotate(-90deg) scale(0.8)', opacity: open ? 1 : 0 }}>
              <span className="absolute w-5 h-[1.5px] bg-white rotate-45" /><span className="absolute w-5 h-[1.5px] bg-white -rotate-45" />
            </button>
            {NAV.map((n, i) => <button key={n} onClick={() => setOpen(false)} className="text-3xl sm:text-4xl text-white/90 font-medium" style={item(i)}>{n}</button>)}
            <div style={item(NAV.length)} className="mt-6"><Cta /></div>
          </div>

          <Hero />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
