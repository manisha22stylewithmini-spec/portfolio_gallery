<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Product designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { inter: ['Inter', 'sans-serif'] } } } };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    html { overflow-x: clip; }
    body { margin: 0; font-family: 'Inter', sans-serif; background-color: #000000; overflow-x: clip; }
    .logo-dark { height: 48px; width: auto; display: block; }
    @media (min-width: 768px) { .logo-dark { height: 58px; } }
    .beat { transition: none; will-change: opacity, transform, filter; }

    .btn-cut {
      clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 12px, 100% calc(100% - 12px),
        calc(100% - 12px) 100%, 12px 100%, 0% calc(100% - 12px), 0% 12px);
    }
    .btn-cut-border {
      position: relative; background: white;
      clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 12px, 100% calc(100% - 12px),
        calc(100% - 12px) 100%, 12px 100%, 0% calc(100% - 12px), 0% 12px);
    }
    .btn-cut-border::before {
      content: ''; position: absolute; inset: 1px; background: black; z-index: 0;
      clip-path: polygon(11px 0%, calc(100% - 11px) 0%, 100% 11px, 100% calc(100% - 11px),
        calc(100% - 11px) 100%, 11px 100%, 0% calc(100% - 11px), 0% 11px);
    }
    .btn-cut-border > * { position: relative; z-index: 1; }
    .btn-cut-sm {
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px);
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-stagger { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-fade { opacity: 0; animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .back-link {
      position: fixed; left: 20px; bottom: 20px; z-index: 60;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.55);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useEffect, useRef, useState } = React;
    const SOCIAL = 'shelf-library.html#social';
    const LIB = 'shelf-library.html#library';
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const SCREENS = 6;   // how many screens of scrolling the film lasts

    // one scene per stretch of the film: the flower, the meadow, the hill, the climb, the butterflies
    const SCENES = [
      { at: 0.10, line: 'Every design starts with a small, curious bloom.', head: ['Hi, I’m Manisha', 'Product designer', 'UX researcher'], tag: 'Seeing people first', sub: 'I start with psychology, then design for how people really think.' },
      { at: 0.30, line: 'Then the field opens up: users, problems, patterns.', head: ['Listening first', 'Mapping what matters', 'Finding the pattern'], tag: 'Research', sub: 'Interviews, journeys and flows that turn messy ideas into clear ones.' },
      { at: 0.50, line: 'Ideas climb the hill, one clean screen at a time.', head: ['Shaping clean screens', 'Calm systems', 'Playful details'], tag: 'Design systems', sub: 'Ten-plus SaaS and B2B platforms, built from one tidy system.' },
      { at: 0.70, line: 'The product rises, ready for real people.', head: ['Shipping with care', 'Twenty live designs', 'Three years strong'], tag: '20+ live designs', sub: 'From first sketch to something people use every day.' },
      { at: 0.90, line: 'And the small joys land last.', head: ['Let’s make something', 'worth coming back to', 'Together'], tag: 'Say hello', sub: 'Open for new projects, big or small.' },
    ];
    const win = (mid) => [mid - 0.09, mid - 0.03, mid + 0.03, mid + 0.09];
    const vis = (p, [a, b, c, d]) => p < a || p > d ? 0 : p < b ? smoother((p - a) / (b - a)) : p <= c ? 1 : smoother(1 - (p - c) / (d - c));
    const WINS = SCENES.map((s) => { const w = win(s.at); if (s.at < 0.2) { w[0] = -1; w[1] = -0.5; } if (s.at > 0.8) { w[2] = 1.5; w[3] = 2; } return w; });

    const ArrowRight = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    );
    const Social = ({ d, label, href }) => (
      <a aria-label={label} href={href} target="_top" className="w-10 h-10 bg-white flex items-center justify-center text-black hover:bg-white/90 transition-colors btn-cut-sm">
        <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d={d} /></svg>
      </a>
    );
    const d = (s) => ({ animationDelay: `${s}s` });

    function useSeekable(ref) {
      const [ok, setOk] = useState(false);
      useEffect(() => {
        const v = ref.current; if (!v) return;
        let dead = false, blobUrl = null;
        const check = () => {
          if (dead || !v.duration) return;
          const r = v.seekable; const full = r.length && r.end(r.length - 1) >= v.duration - 0.1;
          if (full) { setOk(true); return; }
          fetch(v.currentSrc || v.src).then((x) => x.blob()).then((b) => { if (dead) return; blobUrl = URL.createObjectURL(b); v.src = blobUrl; v.addEventListener('loadedmetadata', () => !dead && setOk(true), { once: true }); }).catch(() => setOk(true));
        };
        if (v.readyState >= 1) check(); else v.addEventListener('loadedmetadata', check, { once: true });
        const prime = () => { const p = v.play(); if (p && p.then) p.then(() => v.pause()).catch(() => {}); else v.pause(); };
        prime();
        return () => { dead = true; if (blobUrl) URL.revokeObjectURL(blobUrl); };
      }, []);
      return ok;
    }

    function App() {
      const vid = useRef(null), wrap = useRef(null);
      const beatEls = useRef([]), lineEl = useRef(null), countEl = useRef(null), dots = useRef([]), hintEl = useRef(null);
      const ready = useSeekable(vid);

      useEffect(() => {
        const v = vid.current;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let target = 0, shown = 0, raf = 0, first = true, lag = false, shownIdx = -1;
        const paint = (p) => {
          let best = 0, bv = -1;
          SCENES.forEach((s, i) => {
            const k = vis(p, WINS[i]);
            [0, 1, 2].forEach((g) => {
              const el = beatEls.current[g * SCENES.length + i];
              if (el) { el.style.opacity = k; el.style.visibility = k < 0.01 ? 'hidden' : 'visible'; el.style.transform = `translateY(${(1 - k) * (p < s.at ? 22 : -22)}px)`; el.style.filter = k > 0.99 ? 'none' : `blur(${(1 - k) * 8}px)`; }
            });
            if (k > bv) { bv = k; best = i; }
          });
          if (lineEl.current) { const k = vis(p, WINS[best]); lineEl.current.style.opacity = k; }
          if (best !== shownIdx) {
            shownIdx = best;
            if (lineEl.current) lineEl.current.textContent = SCENES[best].line;
            if (countEl.current) countEl.current.textContent = '0' + (best + 1);
            dots.current.forEach((el, i) => { if (el) el.style.background = i <= (best > 0 ? 1 : 0) && best % 2 === i ? 'rgba(255,255,255,.85)' : 'transparent'; });
          }
          if (hintEl.current) hintEl.current.style.opacity = clamp(1 - p * 14);
        };
        const tick = () => {
          raf = 0;
          shown = reduced || first ? target : shown + (target - shown) * 0.075;
          if (Math.abs(target - shown) < 0.0003) shown = target;
          first = false;
          paint(shown);
          if (ready && v.duration) {
            const w = clamp(shown) * (v.duration - 0.015);
            if (!v.seeking && Math.abs(w - v.currentTime) > 0.015) v.currentTime = w;
            lag = v.seeking || Math.abs(w - v.currentTime) > 0.015;
          }
          if (shown !== target || lag) raf = requestAnimationFrame(tick);
        };
        const onScroll = () => {
          const r = wrap.current.getBoundingClientRect();
          const max = r.height - innerHeight;
          target = max > 0 ? clamp(-r.top / max) : 0;
          if (!raf) raf = requestAnimationFrame(tick);
        };
        onScroll(); tick();
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('resize', onScroll);
        return () => { removeEventListener('scroll', onScroll); removeEventListener('resize', onScroll); cancelAnimationFrame(raf); };
      }, [ready]);

      return (
        <div ref={wrap} className="w-full bg-black font-inter" style={{ height: `${SCREENS * 100}svh` }}>
         <div className="w-full p-3 md:p-4" style={{ position: 'sticky', top: 0, height: '100dvh' }}>
          <div className="w-full h-full rounded-2xl flex flex-col overflow-hidden relative bg-black">
            <video ref={vid} muted playsInline preload="auto" className="absolute inset-0 w-full h-full object-cover anim-fade" style={d(0.2)}
              src="assets/vortx/journey.mp4" poster="assets/vortx/journey.webp" aria-hidden="true" />
            <div className="absolute inset-0 pointer-events-none" style={{ background: 'linear-gradient(180deg, rgba(5,3,16,.45) 0%, rgba(5,3,16,.08) 38%, rgba(5,3,16,.55) 100%)' }} />

            <nav className="relative z-10 flex items-center justify-between px-6 md:px-10 pt-6 md:pt-8">
              <div className="anim-stagger flex flex-col items-start" style={d(0.1)}>
                <img src="assets/logo-dark.webp" alt="Manisha Baroliya" width="380" height="199" className="logo-dark" />
              </div>
              <div className="anim-stagger flex items-center gap-3" style={d(0.2)}>
                <a href={LIB} target="_top" className="hidden md:block px-5 py-2.5 text-white text-sm hover:bg-white/10 btn-cut-border"><span>UX research</span></a>
                <a href={LIB} target="_top" className="hidden md:block px-5 py-2.5 bg-white text-black text-sm hover:bg-white/90 btn-cut">Product design</a>
              </div>
            </nav>

            <div className="relative z-10 flex-1 flex flex-col justify-between px-6 md:px-10 pb-8 md:pb-10">
              <div className="flex-1 flex items-center relative">
                <div className="anim-stagger hidden lg:flex flex-col gap-6 absolute left-0 top-[18%]" style={d(0.4)}>
                  <p ref={lineEl} className="text-white/85 text-base leading-relaxed max-w-[220px]" style={{ minHeight: '7.5em' }}>{SCENES[0].line}</p>
                  <div className="flex flex-col gap-2 mt-4">
                    <div className="flex items-center gap-1">
                      {[0, 1].map((i) => <div key={i} ref={(el) => (dots.current[i] = el)} className="w-4 h-4 rounded-full border border-white/40" style={{ background: i === 0 ? 'rgba(255,255,255,.85)' : 'transparent' }} />)}
                    </div>
                    <div className="flex items-center gap-2 mt-2">
                      <span className="text-white/70 text-xs">Design<br />Journey</span>
                      <span ref={countEl} className="text-white/60 text-xs">01</span>
                    </div>
                  </div>
                </div>

                <div className="anim-stagger w-full text-center relative" style={{ ...d(0.5), minHeight: '3.5em' }}>
                  {SCENES.map((s, i) => (
                    <h1 key={i} ref={(el) => (beatEls.current[i] = el)} className="beat absolute inset-x-0 top-0 text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl font-normal leading-[1.1] tracking-[-0.04em]"
                      style={{ textShadow: '0 2px 18px rgba(5,3,16,0.55)', opacity: i === 0 ? 1 : 0, visibility: i === 0 ? 'visible' : 'hidden' }}>
                      {s.head[0]}<br />{s.head[1]}<br />{s.head[2]}
                    </h1>
                  ))}
                  <h1 aria-hidden="true" className="invisible text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-[1.1]">a<br />b<br />c</h1>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center mt-8">
                <div className="anim-stagger flex items-center justify-center md:justify-end" style={d(0.7)}>
                  <div className="relative max-w-[260px] w-full" style={{ minHeight: '4.5em' }}>
                    {SCENES.map((s, i) => (
                      <p key={i} ref={(el) => (beatEls.current[SCENES.length + i] = el)} className="absolute inset-0 text-white text-sm leading-relaxed text-center md:text-left" style={{ opacity: i === 0 ? 1 : 0, visibility: i === 0 ? 'visible' : 'hidden' }}>{s.sub}</p>
                    ))}
                    <p className="text-white text-sm leading-relaxed text-center md:text-left" style={{ opacity: 0 }} aria-hidden="true">{SCENES[0].sub}</p>
                  </div>
                </div>
                <div className="anim-stagger flex flex-col items-center gap-8 md:gap-24" style={d(0.85)}>
                  <div className="relative h-9 md:h-10 w-full">
                    {SCENES.map((s, i) => (
                      <span key={i} ref={(el) => (beatEls.current[SCENES.length * 2 + i] = el)} className="absolute inset-0 text-center text-white text-2xl md:text-3xl font-medium whitespace-nowrap" style={{ opacity: i === 0 ? 1 : 0, visibility: i === 0 ? 'visible' : 'hidden' }}>{s.tag}</span>
                    ))}
                  </div>
                  <a href={SOCIAL} target="_top" className="w-full max-w-[280px] py-3.5 bg-white flex items-center justify-center gap-2 text-black hover:bg-white/90 transition-colors group btn-cut">
                    <span className="text-sm font-medium">Say hello</span>
                    <ArrowRight className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                  </a>
                </div>
                <div className="anim-stagger flex items-center justify-center md:justify-end gap-3" style={d(1)}>
                  <Social label="Instagram" href={SOCIAL} d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z" />
                  <Social label="LinkedIn" href={SOCIAL} d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                  <Social label="Mail" href={SOCIAL} d="M1.5 4.5h21a1.5 1.5 0 0 1 1.5 1.5v.4l-12 7.2L0 6.4V6a1.5 1.5 0 0 1 1.5-1.5zM0 8.75l12 7.2 12-7.2V18a1.5 1.5 0 0 1-1.5 1.5h-21A1.5 1.5 0 0 1 0 18z" />
                </div>
              </div>
            </div>
            <span ref={hintEl} className="absolute z-10 left-1/2 -translate-x-1/2 bottom-3 text-[11px] tracking-[0.3em] text-white/60 uppercase">Scroll</span>
          </div>
         </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
