<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VortxLab Creations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { inter: ['Inter', 'sans-serif'] } } } };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background-color: #000000; }

    .btn-cut {
      clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 12px, 100% calc(100% - 12px),
        calc(100% - 12px) 100%, 12px 100%, 0% calc(100% - 12px), 0% 12px);
    }
    .btn-cut-border {
      position: relative; background: white;
      clip-path: polygon(12px 0%, calc(100% - 12px) 0%, 100% 12px, 100% calc(100% - 12px),
        calc(100% - 12px) 100%, 12px 100%, 0% calc(100% - 12px), 0% 12px);
    }
    .btn-cut-border::before {
      content: ''; position: absolute; inset: 1px; background: black; z-index: 0;
      clip-path: polygon(11px 0%, calc(100% - 11px) 0%, 100% 11px, 100% calc(100% - 11px),
        calc(100% - 11px) 100%, 11px 100%, 0% calc(100% - 11px), 0% 11px);
    }
    .btn-cut-border > * { position: relative; z-index: 1; }
    .btn-cut-sm {
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px);
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-stagger { opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-fade { opacity: 0; animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .back-link {
      position: fixed; left: 20px; bottom: 20px; z-index: 60;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.55);
    }
  </style>
</head>
<body>

  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

                      <div className="w-4 h-4 rounded-full border border-white/40" />

                    style={{ textShadow: '0 2px 12px rgba(0,0,0,0.25)' }}>
                    Forging Tomorrow<br />Virtual Horizon<br />VortxLab Creations
                  </h1>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center mt-8">
                <div className="anim-stagger flex items-center justify-center md:justify-end" style={d(0.7)}>
                  <p className="text-white text-sm leading-relaxed max-w-[260px] text-center md:text-left md:ml-auto">
                    We push past conventions, reshaping the virtual terrain with next-level technologies.

                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
