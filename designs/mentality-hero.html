<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mėntality — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
      colors: { 'brand-green': '#9fff00', 'bg-base': '#EDEEF5' },
    } } };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; background: #EDEEF5; color: #18181b; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes rise { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .rise { animation: rise 0.8s ease both; }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 70;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.65);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const LINKS = ['service', 'patient resources', 'about us', 'education center'];

    const Flower = () => (
      <svg width="28" height="28" viewBox="0 0 32 32" fill="#1a1a1a" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="8" r="7" /><circle cx="24" cy="16" r="7" /><circle cx="16" cy="24" r="7" /><circle cx="8" cy="16" r="7" />
        <circle cx="16" cy="16" r="3" fill="#EDEEF5" />
      </svg>
    );

    function Navbar() {
      const [open, setOpen] = useState(false);
      const bar = 'absolute left-0 h-[1.5px] w-5 bg-[#1a1a1a] transition-all duration-300';
      return (
        <header className="fixed top-0 left-0 w-full z-50 py-6 md:py-10 bg-gradient-to-b from-[#f1f1f1]/80 to-transparent backdrop-blur-[2px]">
          <div className="grid grid-cols-12 max-w-7xl mx-auto px-8 md:px-16 lg:px-20 items-center gap-x-4">
            <a href="#" className="col-span-8 md:col-span-3 flex items-center gap-2">
              <Flower /><span className="font-display text-xl tracking-tight text-[#1a1a1a]">mėntality</span>
            </a>
            <nav className="hidden md:flex md:col-span-6 justify-center gap-8">
              {LINKS.map((l) => <a key={l} href="#" className="text-sm lowercase text-zinc-700 hover:text-black transition-colors">{l}</a>)}
            </nav>
            <div className="col-span-4 md:col-span-3 flex items-center justify-end gap-4">
              <a href="#" className="hidden md:inline text-sm lowercase text-zinc-700 hover:text-black">find help</a>
              <button className="hidden md:inline-block bg-black text-white rounded-full px-5 py-2.5 text-sm lowercase">get started →</button>
              <button onClick={() => setOpen(!open)} aria-label="Menu" className="md:hidden relative w-6 h-6">
                <span className={bar} style={{ top: open ? 11 : 6, transform: open ? 'rotate(45deg)' : 'none' }} />
                <span className={bar} style={{ top: open ? 11 : 16, transform: open ? 'rotate(-45deg)' : 'none' }} />
              </button>
            </div>
          </div>
          <div className={`md:hidden overflow-hidden transition-all duration-400 ease-out ${open ? 'max-h-96 opacity-100 translate-y-0' : 'max-h-0 opacity-0 -translate-y-2'}`} style={{ transitionDuration: '400ms' }}>
            <div className="mx-8 mt-6 flex flex-col gap-4 rounded-2xl bg-white/80 p-6 backdrop-blur-md">
              {[...LINKS, 'find help'].map((l) => <a key={l} href="#" onClick={() => setOpen(false)} className="text-lg lowercase text-zinc-800">{l}</a>)}
              <button className="bg-black text-white rounded-full px-5 py-3 text-sm lowercase self-start">get started →</button>
            </div>
          </div>
        </header>
      );
    }

    function Hero() {
      return (
        <section className="relative min-h-[110vh] sm:min-h-[140vh] w-full flex flex-col items-center justify-start overflow-hidden bg-bg-base">
          <div className="absolute top-[15vh] sm:top-[20vh] left-0 w-full h-[95vh] sm:h-[120vh] z-0 pointer-events-none">
            <video autoPlay loop muted playsInline className="w-full h-full object-cover opacity-100"
              src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260603_132049_036591b8-6e92-4760-b94c-a7ea6eef315c.mp4" />
            <div className="absolute top-0 left-0 w-full h-24 sm:h-32 bg-gradient-to-b from-bg-base to-transparent"></div>
          </div>

          <div className="max-w-7xl w-full mx-auto px-8 md:px-16 lg:px-20 relative z-10 grid grid-cols-12 gap-x-4 md:gap-x-8 pt-36 md:pt-48">
            <div className="col-span-12 md:col-span-10 md:col-start-2">
              <h1 className="rise font-display text-[28px] sm:text-4xl md:text-5xl lg:text-6xl leading-[1.15] tracking-tight">
                <span className="text-[#1a1a1a]">Remix: Mentality offers</span>{' '}
                <span className="text-[#8e8e8e]">information<br />and resources to help you manage<br />your{' '}
                  <span className="w-[16px] md:w-[42px] lg:w-[62px] h-[10px] md:h-[24px] lg:h-[34px] border-[2px] border-[#1a1a1a] rounded-full inline-flex items-center justify-center align-middle mx-1">
                    <span className="w-2 h-2 rounded-full bg-black" />
                  </span>{' '}mental wellbeing.</span>
              </h1>

              <div className="rise mt-10 max-w-md" style={{ animationDelay: '0.15s' }}>
                <div className="bg-white rounded-[6px] border border-black/[0.05] p-1 pl-4 flex items-center shadow-sm">
                  <input placeholder="Ask me anything..." className="flex-1 bg-transparent outline-none text-sm text-zinc-800 placeholder:text-zinc-400" />
                  <button aria-label="Send" className="bg-[#1a1a1a] text-white w-9 h-9 rounded-full relative flex items-center justify-center">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <button className="absolute right-4 md:right-8 top-1/2 z-10 rounded-full bg-white/30 backdrop-blur-md border border-white/40 px-4 py-2 text-xs text-zinc-800">pl — en</button>
          <span className="absolute bottom-6 left-6 md:left-10 z-10 text-xs text-white">2024</span>
          <span className="absolute bottom-6 right-6 md:right-10 z-10 text-xs text-white">mental health tools</span>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <div className="min-h-screen bg-bg-base selection:bg-brand-green selection:text-black"><Navbar /><main><Hero /></main></div>
    );
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
