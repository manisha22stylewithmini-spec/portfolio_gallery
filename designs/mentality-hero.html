<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Product designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
      colors: { 'brand-green': '#9fff00', 'bg-base': '#EDEEF5' },
    } } };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; background: #1d5fae; color: #fff; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    @keyframes rise { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .rise { animation: rise 0.8s ease both; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
    /* the film is portrait, so on a wide screen it is scaled to the full width and the window rests on its middle:
       the horizon, where the train runs and the water mirrors the sky */
    .bgvid { object-fit: cover; object-position: 50% 52%; }
    .shade { text-shadow: 0 2px 24px rgba(8, 32, 74, .45), 0 0 2px rgba(8, 32, 74, .2); }
    /* die-cut sticker outline, so the black script keeps its shape on the sky */
    .logo-sticker {
      height: 46px; width: auto; display: block;
      filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff);
    }
    @media (min-width: 640px) { .logo-sticker { height: 54px; } }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 70;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const SOCIAL = 'shelf-library.html#social';          // every sticker on the social calendar opens a chat with me
    const LINKS = [
      { label: 'work', href: 'shelf-library.html#library' },
      { label: 'about', href: 'halcyon-hero.html' },      // the design-POV journey tells who I am
      { label: 'social', href: SOCIAL },
    ];

    function Navbar() {
      const [open, setOpen] = useState(false);
      const bar = 'absolute left-0 h-[1.5px] w-5 bg-white transition-all duration-300';
      return (
        <header className="fixed top-0 left-0 w-full z-50 py-4 md:py-6 bg-gradient-to-b from-[#0a2c63]/45 to-transparent">
          <div className="grid grid-cols-12 max-w-7xl mx-auto px-6 md:px-16 lg:px-20 items-center gap-x-4">
            <a href="#" aria-label="Manisha Baroliya" className="col-span-8 md:col-span-3 flex items-center">
              <img src="assets/logo-wide.webp" alt="Manisha Baroliya" width="360" height="186" className="logo-sticker" />
            </a>
            <nav className="hidden md:flex md:col-span-6 justify-center gap-10">
              {LINKS.map((l) => <a key={l.label} href={l.href} target="_top" className="shade text-sm lowercase text-white/90 hover:text-white transition-colors">{l.label}</a>)}
            </nav>
            <div className="col-span-4 md:col-span-3 flex items-center justify-end gap-4">
              <a href={SOCIAL} target="_top" className="hidden md:inline-block bg-white text-black rounded-full px-5 py-2.5 text-sm lowercase hover:bg-brand-green transition-colors">get in touch →</a>
              <button onClick={() => setOpen(!open)} aria-label="Menu" className="md:hidden relative w-6 h-6">
                <span className={bar} style={{ top: open ? 11 : 6, transform: open ? 'rotate(45deg)' : 'none' }} />
                <span className={bar} style={{ top: open ? 11 : 16, transform: open ? 'rotate(-45deg)' : 'none' }} />
              </button>
            </div>
          </div>
          <div className={`md:hidden overflow-hidden transition-all ease-out ${open ? 'max-h-96 opacity-100 translate-y-0' : 'max-h-0 opacity-0 -translate-y-2'}`} style={{ transitionDuration: '400ms' }}>
            <div className="mx-6 mt-5 flex flex-col gap-4 rounded-2xl bg-[#0a2c63]/70 p-6 backdrop-blur-md">
              {LINKS.map((l) => <a key={l.label} href={l.href} target="_top" onClick={() => setOpen(false)} className="text-lg lowercase text-white">{l.label}</a>)}
              <a href={SOCIAL} target="_top" className="bg-white text-black rounded-full px-5 py-3 text-sm lowercase self-start">get in touch →</a>
            </div>
          </div>
        </header>
      );
    }

    function Hero() {
      const [msg, setMsg] = useState('');
      const go = () => { window.top.location.href = SOCIAL; };
      return (
        <section className="relative w-full overflow-hidden" style={{ height: '100svh', minHeight: 560 }}>
          {/* the film fills the whole hero edge to edge */}
          <video className="bgvid absolute inset-0 w-full h-full" autoPlay loop muted playsInline preload="auto"
            src="assets/train/train.mp4" poster="assets/train/train.webp" aria-hidden="true" />
          {/* a gentle scrim so the words stay readable on the bright sky */}
          <div className="absolute inset-0 pointer-events-none" style={{ background: 'radial-gradient(ellipse 78% 46% at 36% 52%, rgba(8,36,84,.46), transparent 72%), linear-gradient(180deg, rgba(8,36,84,.42) 0%, rgba(8,36,84,.10) 40%, rgba(8,36,84,.30) 100%)' }} />

          <div className="relative z-10 h-full max-w-7xl w-full mx-auto px-6 md:px-16 lg:px-20 flex flex-col justify-center pt-20">
            <div className="md:max-w-[88%] lg:max-w-[80%]">
              <h1 className="rise shade font-display text-[30px] sm:text-4xl md:text-5xl lg:text-6xl leading-[1.15] tracking-tight">
                <span className="text-white">Hi, I'm Manisha, a product designer and UX researcher</span>{' '}
                <span className="text-white/70">turning messy ideas into clean, playful<br className="hidden md:inline" />{' '}
                  <span className="w-[18px] md:w-[42px] lg:w-[62px] h-[11px] md:h-[24px] lg:h-[34px] border-[2px] border-white rounded-full inline-flex items-center justify-center align-middle mx-1">
                    <span className="w-2 h-2 rounded-full bg-white" />
                  </span>{' '}interfaces.</span>
              </h1>

              <div className="rise mt-10 max-w-md" style={{ animationDelay: '0.15s' }}>
                <div className="bg-white/95 rounded-[6px] border border-black/[0.05] p-1 pl-4 flex items-center shadow-lg shadow-[#0a2c63]/20">
                  <input value={msg} onChange={(e) => setMsg(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && go()}
                    placeholder="Tell me about your project..." className="flex-1 bg-transparent outline-none text-sm text-zinc-800 placeholder:text-zinc-400" />
                  <a href={SOCIAL} target="_top" aria-label="Get in touch" className="bg-[#1a1a1a] text-white w-9 h-9 rounded-full relative flex items-center justify-center hover:bg-black transition-colors">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                  </a>
                </div>
              </div>
            </div>
          </div>

          <span className="shade absolute bottom-6 left-32 z-10 text-xs text-white/90 hidden sm:inline">3+ years · 20+ live designs</span>
          <span className="shade absolute bottom-6 right-6 md:right-10 z-10 text-xs text-white/90">UI/UX · research · design systems</span>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <div className="min-h-screen selection:bg-brand-green selection:text-black"><Navbar /><main><Hero /></main></div>
    );
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
