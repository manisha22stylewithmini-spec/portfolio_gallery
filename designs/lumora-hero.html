<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; height: 100%; font-family: 'Instrument Serif', serif; }
    body { background: #000; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* die-cut sticker outline, so the black script stays readable over every background */
    .logo-sticker {
      height: 56px; width: auto; display: block;
      filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 6px 10px rgba(0,0,0,.28));
    }
    @media (min-width: 640px) { .logo-sticker { height: 64px; } }

    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.75);
      padding: 6px 12px; border-radius: 999px; text-decoration: none;
      background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    const Icon = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    // Lucide "menu" and "x" glyphs
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    // one looping background (H.264, 720p, no audio) with a poster for the first paint
    const VIDEO = { src: 'assets/hero/craft.mp4', poster: 'assets/hero/craft.webp' };
    const CONNECT = 'shelf-library.html#social';   // every sticker on the social calendar opens a chat with me
    const STATS = ['3+ Years Experience', '20+ Live Designs', 'UI/UX · Research · Design Systems', 'AI-assisted Workflow'];
    const SANS = { fontFamily: 'system-ui, sans-serif' };
    const SHADE = { textShadow: '0 1px 14px rgba(0,0,0,.5), 0 0 2px rgba(0,0,0,.25)' };

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const ease = { transitionTimingFunction: 'cubic-bezier(0.4,0,0.2,1)' };

      return (
        <section className="relative w-full h-screen overflow-hidden bg-black">
          {/* Background video: fixed behind everything, plays on a loop */}
          <video src={VIDEO.src} poster={VIDEO.poster} autoPlay muted loop playsInline preload="auto"
            className="absolute inset-0 w-full h-full object-cover" />

          {/* soft scrims keep the type readable on the bright footage */}
          <div className="absolute inset-0 pointer-events-none"
            style={{ zIndex: 1, background: 'radial-gradient(ellipse 70% 42% at 50% 36%, rgba(0,0,0,.5), rgba(0,0,0,0) 75%), linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.22) 50%, rgba(0,0,0,.05) 70%)' }} />
          <div className="absolute inset-x-0 bottom-0 h-40 pointer-events-none"
            style={{ zIndex: 1, background: 'linear-gradient(0deg, rgba(0,0,0,.5), rgba(0,0,0,0))' }} />

          {/* Mobile menu */}
          <div className={`fixed inset-0 z-50 md:hidden transition-opacity duration-500 ${menuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`} style={ease}>
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setMenuOpen(false)} />
            <div className="relative h-full flex flex-col items-center justify-center gap-6">
              <a href={CONNECT} target="_top"
                className={`bg-white text-black rounded-full px-10 py-4 text-lg transition-all duration-500 ${menuOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-90'}`}
                style={{ ...SANS, ...ease, transitionDelay: menuOpen ? '150ms' : '0ms' }}>Get connected</a>
            </div>
          </div>

          {/* Content */}
          <div className="relative h-full flex flex-col" style={{ zIndex: 2 }}>
            <nav className="flex items-center justify-between px-5 sm:px-8 md:px-12 pt-5 sm:pt-6">
              <img src="assets/logo-wide.webp" alt="Manisha Baroliya" width="360" height="186" className="logo-sticker z-[60] relative" />

              <a href={CONNECT} target="_top" style={SANS}
                className="hidden md:inline-flex rounded-full px-6 py-2.5 text-sm font-medium bg-white text-black">
                Get connected
              </a>

              <button onClick={() => setMenuOpen(!menuOpen)} aria-label="Toggle menu"
                className="md:hidden liquid-glass rounded-full w-11 h-11 flex items-center justify-center text-white relative z-[60]">
                <Menu className={`absolute w-5 h-5 transition-all duration-300 ${menuOpen ? 'opacity-0 rotate-90 scale-75' : 'opacity-100 rotate-0 scale-100'}`} />
                <X className={`absolute w-5 h-5 transition-all duration-300 ${menuOpen ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-75'}`} />
              </button>
            </nav>

            <div className="flex flex-col items-center text-center px-5 pt-10 sm:pt-14 md:pt-16 text-white">
              <div className="liquid-glass rounded-full px-4 py-1.5 text-xs sm:text-sm mb-6" style={SANS}>
                Product designer &amp; UX researcher · open for new projects
              </div>

              <h1 className="text-4xl sm:text-5xl md:text-7xl lg:text-[5.5rem] leading-[1.1] max-w-4xl">
                Messy Ideas, Turned into<br />Clean, Playful Interfaces
              </h1>

              <p className="mt-5 max-w-xl leading-relaxed text-sm sm:text-base text-white/90" style={{ ...SANS, ...SHADE }}>
                I'm Manisha — I design products that feel human and brands that look like themselves, from first research to the last pixel of the prototype.
              </p>

              <div className="liquid-glass rounded-full mt-8 flex items-center w-full max-w-[340px] sm:max-w-md pl-5 pr-1.5 py-1.5">
                <span className="flex-1 min-w-0 text-left text-sm truncate" style={SANS}>Have an idea? Let's build it.</span>
                <a href={CONNECT} target="_top"
                  className="rounded-full px-4 py-2 text-xs sm:text-sm font-medium whitespace-nowrap bg-white text-black" style={SANS}>
                  Get connected
                </a>
              </div>
            </div>

            <div className="flex-1" />

            <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 px-5 pb-10 sm:pb-8 text-white/85 text-xs sm:text-sm" style={{ ...SANS, textShadow: '0 1px 10px rgba(0,0,0,.55)' }}>
              {STATS.map((s, i) => (
                <React.Fragment key={s}>
                  {i > 0 && <span className="hidden sm:inline text-white/30">|</span>}
                  <span>{s}</span>
                </React.Fragment>
              ))}
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
