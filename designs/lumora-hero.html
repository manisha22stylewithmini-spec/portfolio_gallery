<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumora — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; height: 100%; font-family: 'Instrument Serif', serif; }
    body { background: #000; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes train-bob {
      0%, 100% { transform: translateY(0) scale(1.03); }
      50%      { transform: translateY(-6px) scale(1.03); }
    }
    .train-bob { animation: train-bob 3s ease-in-out infinite; }

    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.75);
      padding: 6px 12px; border-radius: 999px; text-decoration: none;
      background: rgba(0,0,0,.35); backdrop-filter: blur(6px);
    }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;

    const Icon = ({ children, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        {children}
      </svg>
    );
    // Lucide "menu" and "x" glyphs
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    const VIDEOS = [
      { label: 'Golden Hour', src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081127_0992a171-d3c6-4978-8213-0ec5df8b6d63.mp4' },
      { label: 'Still Water', src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_092026_dd05b805-ea0f-40b2-8c52-332b88502592.mp4' },
      { label: 'Deep Woods',  src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_081042_df7202bf-bd80-4b2b-bbc6-1f09ba2870e9.mp4' },
      { label: 'Quiet Dawn',  src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260702_080959_4cac5234-3573-464e-a5b7-76b94b8a7d61.mp4' },
    ];
    const OVERLAY = 'https://soft-zoom-63098134.figma.site/_assets/v11/0b4a435b2df2747593c43d7a1c9b4578f7d8d90c.png';
    const NAV = ['How It Works', 'Features', 'Pricing', 'Community'];
    const STATS = ['60+ Deep Sessions', '12,000+ Creators', '4.8 User Satisfaction', 'Intentional-First Design'];
    const SANS = { fontFamily: 'system-ui, sans-serif' };

    function App() {
      const [activeVideo, setActiveVideo] = useState(0);
      const [isTransitioning, setIsTransitioning] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);

      const dark = activeVideo === 2;
      const tone = dark ? 'text-[#182C41]' : 'text-white';
      const toneTrans = 'transition-colors duration-700';

      const switchVideo = (i) => {
        if (i === activeVideo || isTransitioning) return;
        setActiveVideo(i);
        setIsTransitioning(true);
        setTimeout(() => setIsTransitioning(false), 1000);
      };

      const ease = { transitionTimingFunction: 'cubic-bezier(0.4,0,0.2,1)' };

      return (
        <section className="relative w-full h-screen overflow-hidden bg-black">
          {/* Videos */}
          {VIDEOS.map((v, i) => (
            <video key={v.src} src={v.src} autoPlay muted loop playsInline
              className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 ease-in-out ${i === activeVideo ? 'opacity-100' : 'opacity-0'}`} />
          ))}

          {/* PNG overlay */}
          <img src={OVERLAY} alt="" className="train-bob absolute inset-0 w-full h-full object-cover pointer-events-none" style={{ zIndex: 1 }} />

          {/* Mobile menu */}
          <div className={`fixed inset-0 z-50 md:hidden transition-opacity duration-500 ${menuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`} style={ease}>
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setMenuOpen(false)} />
            <div className="relative h-full flex flex-col items-center justify-center gap-6">
              {NAV.map((l, i) => (
                <a key={l} href="#" onClick={() => setMenuOpen(false)}
                  className={`text-white text-3xl transition-all duration-500 ${menuOpen ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}
                  style={{ ...ease, transitionDelay: menuOpen ? `${100 + i * 50}ms` : '0ms' }}>{l}</a>
              ))}
              <button
                className={`mt-4 bg-white text-black rounded-full px-8 py-3 text-base transition-all duration-500 ${menuOpen ? 'opacity-100 scale-100' : 'opacity-0 scale-90'}`}
                style={{ ...SANS, ...ease, transitionDelay: menuOpen ? '350ms' : '0ms' }}>Get Started</button>
            </div>
          </div>

          {/* Content */}
          <div className="relative h-full flex flex-col" style={{ zIndex: 2 }}>
            <nav className="flex items-center justify-between px-5 sm:px-8 md:px-12 pt-5 sm:pt-6">
              <span className="text-white italic text-xl sm:text-2xl z-[60]">Lumora</span>

              <div className="hidden md:flex liquid-glass rounded-full items-center gap-7 pl-7 pr-2 py-2" style={SANS}>
                {NAV.map((l) => <a key={l} href="#" className="text-white/90 hover:text-white text-sm transition-colors">{l}</a>)}
                <button className="bg-white text-black rounded-full px-5 py-2 text-sm font-medium">Get Started</button>
              </div>

              <button onClick={() => setMenuOpen(!menuOpen)} aria-label="Toggle menu"
                className="md:hidden liquid-glass rounded-full w-11 h-11 flex items-center justify-center text-white relative z-[60]">
                <Menu className={`absolute w-5 h-5 transition-all duration-300 ${menuOpen ? 'opacity-0 rotate-90 scale-75' : 'opacity-100 rotate-0 scale-100'}`} />
                <X className={`absolute w-5 h-5 transition-all duration-300 ${menuOpen ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-75'}`} />
              </button>
            </nav>

            <div className="flex flex-col items-center text-center px-5 pt-10 sm:pt-14 md:pt-16">
              <div className={`liquid-glass rounded-full px-4 py-1.5 text-xs sm:text-sm mb-6 ${tone} ${toneTrans}`} style={SANS}>
                Over 10,000 minds already finding their clarity
              </div>

              <h1 className={`text-4xl sm:text-5xl md:text-7xl lg:text-[5.5rem] leading-[1.1] max-w-4xl ${tone} ${toneTrans}`}>
                Clarity in an Endlessly<br />Noisy Universe
              </h1>

              <p className={`mt-5 max-w-xl leading-relaxed text-sm sm:text-base ${dark ? 'text-[#182C41]' : 'text-white/80'} ${toneTrans}`} style={SANS}>
                Rise above the chaos of pings, infinite scrolling, and relentless demands. Discover how to protect your presence and create with intention.
              </p>

              <form onSubmit={(e) => e.preventDefault()}
                className="liquid-glass rounded-full mt-8 flex items-center w-full max-w-[320px] sm:max-w-sm pl-5 pr-1.5 py-1.5">
                <input type="email" placeholder="Your Best Email"
                  className={`bg-transparent outline-none flex-1 min-w-0 text-sm ${tone} ${toneTrans} ${dark ? 'placeholder:text-[#182C41]/60' : 'placeholder:text-white/60'}`} style={SANS} />
                <button type="submit" className="bg-white text-black rounded-full px-4 py-2 text-xs sm:text-sm font-medium whitespace-nowrap" style={SANS}>
                  Get Early Access
                </button>
              </form>

              <div className="mt-8 flex flex-wrap justify-center gap-x-5 gap-y-2" style={SANS}>
                {VIDEOS.map((v, i) => (
                  <button key={v.label} onClick={() => switchVideo(i)}
                    className={`text-xs sm:text-sm pb-1 border-b transition-all duration-700 ${tone} ${i === activeVideo ? (dark ? 'border-[#182C41]' : 'border-white') : 'opacity-50 border-transparent hover:opacity-80'}`}>
                    {v.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex-1" />

            <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 px-5 pb-10 sm:pb-8 text-white/70 text-xs sm:text-sm" style={SANS}>
              {STATS.map((s, i) => (
                <React.Fragment key={s}>
                  {i > 0 && <span className="hidden sm:inline text-white/30">|</span>}
                  <span>{s}</span>
                </React.Fragment>
              ))}
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
