<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fearless Vision — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; background: #fff; }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wordUp { from { transform: translateY(110%); } to { transform: translateY(0); } }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 70;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.65);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const ACCENT = '#5E0ED7';
    const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
    const Icon = ({ size = 24, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const ArrowUpRight = (p) => <Icon {...p}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    const down = (i) => ({ animation: `fadeDown 0.5s ${EASE} ${i * 0.1}s both` });
    const up = (i) => ({ animation: `fadeUp 0.6s ${EASE} ${i * 0.12}s both` });
    const LINKS = ['Story', 'Expertise', 'Studios', 'Feedback'];
    const STATS = [['300', 'CRAFTED\nBRANDS'], ['200', 'DIGITAL\nPRODUCTS'], ['100', 'VENTURES\nFUNDED']];
    const WORDS = ['Fearless', 'Vision', 'Delivered'];
    const upper = 'uppercase tracking-widest font-semibold text-black';

    const Logo = () => (
      <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ border: `2px solid ${ACCENT}` }}>
        <div className="w-[10px] h-[10px] rounded-full" style={{ background: ACCENT }} />
      </div>
    );

    function App() {
      const [open, setOpen] = useState(false);
      return (
        <div className="relative min-h-screen flex flex-col overflow-hidden bg-black" style={{ fontFamily: "'Inter', sans-serif" }}>
          <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover"
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260517_222138_3e3205be-3364-417b-a64a-bfe087acbec4.mp4" />

          {open && (
            <div className="fixed inset-0 z-50 bg-white flex flex-col px-5 sm:px-8 pt-5 pb-8">
              <div className="flex items-center justify-between">
                <Logo />
                <button onClick={() => setOpen(false)} aria-label="Close" className="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center"><X size={16} /></button>
              </div>
              <div className="flex flex-col gap-8 mt-16">
                {LINKS.map((l) => <a key={l} href="#" onClick={() => setOpen(false)} className={`text-3xl ${upper}`}>{l}</a>)}
              </div>
              <a href="#" className="mt-auto flex items-center gap-2 text-xl font-semibold uppercase tracking-widest" style={{ color: ACCENT }}>Work With Us <ArrowUpRight size={22} /></a>
            </div>
          )}

          <div className="relative z-10 flex flex-col min-h-screen">
            <nav className="flex items-center justify-between px-5 sm:px-8 md:px-12 pt-5 md:pt-6">
              <div style={down(0)}><Logo /></div>
              <div className="hidden md:flex items-center gap-10">
                {LINKS.map((l, i) => <a key={l} href="#" className={`text-sm ${upper}`} style={down(i + 1)}>{l}</a>)}
              </div>
              <button onClick={() => setOpen(true)} aria-label="Menu" style={down(5)}
                className="w-9 h-9 rounded-full bg-black flex flex-col items-center justify-center gap-1">
                {[0, 1, 2].map((k) => <span key={k} className="w-4 h-0.5 bg-white" />)}
              </button>
            </nav>

            <div className="flex-1 flex items-center justify-end px-5 sm:px-8 md:px-12 py-8 md:py-0">
              <div className="flex gap-5 sm:gap-8 md:gap-10">
                {STATS.map(([n, label], i) => (
                  <div key={n} className="text-right" style={up(i + 2)}>
                    <div className="text-black font-semibold leading-none" style={{ fontSize: 'clamp(1.5rem, 5vw, 3.5rem)' }}>
                      <span style={{ color: ACCENT, fontSize: '0.5em' }}>+</span>{n}
                    </div>
                    <p className={`mt-2 text-[10px] sm:text-xs md:text-sm whitespace-pre-line leading-tight ${upper}`}>{label}</p>
                  </div>
                ))}
              </div>
            </div>

            <div className="px-5 sm:px-8 md:px-12 pb-8 md:pb-12 flex flex-col gap-6 md:gap-12">
              <div className="flex items-center justify-between gap-4">
                <p className={`text-[10px] sm:text-xs md:text-sm max-w-[130px] sm:max-w-[160px] md:max-w-xs ${upper}`} style={up(5)}>
                  Shaping Bold<br />Visions Into Power<br />For Your Tribe
                </p>
                <a href="#" className="flex items-center gap-1 text-base sm:text-xl md:text-2xl font-semibold whitespace-nowrap" style={{ ...up(6), color: ACCENT }}>
                  Work With Us <ArrowUpRight size={22} />
                </a>
              </div>

              <div className="flex items-end justify-between gap-3 sm:gap-4">
                <div className="w-[120px] sm:w-[180px] md:w-[280px] shrink-0" style={up(7)}>
                  <p className={`text-[9px] sm:text-xs md:text-sm text-left md:text-right ${upper}`}>Creative Studios Built Around Elevating Your Vision Into Striking Reality</p>
                </div>
                <h1 className="text-right">
                  {WORDS.map((w, i) => (
                    <div key={w} className="overflow-hidden">
                      <div className="font-semibold uppercase text-black" style={{ fontSize: 'clamp(2rem, 9vw, 9rem)', lineHeight: 0.88, animation: `wordUp 0.7s ${EASE} ${0.4 + i * 0.14}s both` }}>{w}</div>
                    </div>
                  ))}
                </h1>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
