<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Design that feels human</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    /* the orb clip is rendered on pure white, the same as the page, so its square has no visible edge */
    :root { --bg: #ffffff; --S: max(125vh, 62vw); }
    html, body { background: var(--bg); }
    body { margin: 0; }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wordUp { from { transform: translateY(110%); } to { transform: translateY(0); } }
    @keyframes sheetIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes orbIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    /* the orb: a square clip scaled big, the orb itself sitting left of centre. The wrapper is moved by script (it follows the cursor),
       the video inside plays the entrance; a soft edge fade hides the frame. */
    .orbwrap { position: absolute; width: var(--S); height: var(--S); left: calc(30vw - .49 * var(--S)); top: calc(52vh - .50 * var(--S)); pointer-events: none; will-change: transform;
      -webkit-mask-image: radial-gradient(closest-side, #000 84%, transparent 100%); mask-image: radial-gradient(closest-side, #000 84%, transparent 100%); }
    .orbwrap.menu { z-index: 55; }              /* above the menu's white sheet (z 50), below its words (z 60) */
    .orbvid { display: block; width: 100%; height: 100%; animation: orbIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) .1s both; }
    @media (max-width: 767px) { :root { --S: 150vw; } .orbwrap { left: calc(50vw - .49 * var(--S)); top: calc(27vh - .50 * var(--S)); } }
    /* die-cut sticker outline, so the black script keeps its shape */
    .logo-sticker {
      height: 44px; width: auto; display: block;
      filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff);
    }
    @media (min-width: 640px) { .logo-sticker { height: 52px; } }
    .tx { text-shadow: 0 1px 14px rgba(255,255,255,.95), 0 0 3px rgba(255,255,255,.7); }   /* keeps the small caps legible where they cross the orb's rings */
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 70;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.65);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const ACCENT = '#5E0ED7';
    const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
    const SOCIAL = 'shelf-library.html#social';     // every sticker on the social calendar opens a chat with me
    const Icon = ({ size = 24, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const ArrowUpRight = (p) => <Icon {...p}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    const down = (i) => ({ animation: `fadeDown 0.5s ${EASE} ${i * 0.1}s both` });
    const up = (i) => ({ animation: `fadeUp 0.6s ${EASE} ${i * 0.12}s both` });
    const LINKS = [
      { label: 'Work', href: 'shelf-library.html#library' },
      { label: 'About', href: 'halcyon-hero.html' },     // the design-POV journey tells who I am
      { label: 'Social', href: SOCIAL },
    ];
    const STATS = [['3', 'YEARS\nDESIGNING'], ['20', 'LIVE\nDESIGNS'], ['10', 'SAAS & B2B\nPLATFORMS']];
    const WORDS = ['Design', 'That feels', 'Human'];
    const upper = 'tx uppercase tracking-widest font-semibold text-black';

    const Logo = () => (
      <a href="#" aria-label="Manisha Baroliya" className="block">
        <img src="assets/logo-wide.webp" alt="Manisha Baroliya" width="360" height="186" className="logo-sticker" />
      </a>
    );

    function App() {
      const [open, setOpen] = useState(false);
      const orb = useRef(null), vid = useRef(null);

      // One orb for the hero and the menu. It follows the pointer across the whole screen, speeds up as you get close to it
      // (press and hold does the same on touch), and glides to the right when the menu opens so the words stay clear of it.
      const openRef = useRef(false), kickRef = useRef(null);
      openRef.current = open;
      useEffect(() => {
        const w = orb.current, v = vid.current;
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const BASE = 0.85, MAX = 4.2, PULL = 0.62;
        let g, mx = null, my = null, held = false, ox = 0, oy = 0, bx = 0, rate = BASE, spd = 0, pmx = 0, pmy = 0, pt = 0, raf = 0, last = 0;
        const geo = () => {       // mirrors the CSS: where the orb rests
          const W = innerWidth, H = innerHeight, small = W < 768, Sz = small ? 1.5 * W : Math.max(1.25 * H, 0.62 * W);
          const left = (small ? 0.5 : 0.30) * W - 0.49 * Sz, top = (small ? 0.27 : 0.52) * H - 0.50 * Sz;
          g = { W, H, small, Sz, cx: left + 0.49 * Sz, cy: top + 0.50 * Sz };
        };
        const frame = (t) => {
          raf = 0;
          const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
          const bxT = openRef.current && !g.small ? 0.38 * g.W : 0;                 // menu open: rest on the right-hand side
          const restX = g.cx + bx, restY = g.cy;
          let tx = 0, ty = 0, prox = 0;
          if (mx !== null) {
            // pull the orb most of the way to the pointer, wherever it is on the screen, keeping its centre on screen
            tx = clamp((mx - restX) * PULL, 0.05 * g.W - restX, 0.95 * g.W - restX);
            ty = clamp((my - restY) * PULL, 0.05 * g.H - restY, 0.95 * g.H - restY);
            prox = clamp(1 - (Math.hypot(mx - (restX + ox), my - (restY + oy)) - 0.27 * g.Sz) / (0.22 * g.Sz));
          }
          if (held) prox = 1;
          spd *= Math.exp(-dt * 3);                                                  // pointer speed fades when it stops
          const kp = 1 - Math.exp(-dt * 5), kr = 1 - Math.exp(-dt * 4), kb = 1 - Math.exp(-dt * 3.2);
          const target = BASE + prox * (MAX - BASE) + clamp(spd / 2600) * 1.4;      // hovering is fastest; a quick sweep also spins it up
          ox += (tx - ox) * kp; oy += (ty - oy) * kp; bx += (bxT - bx) * kb; rate += (target - rate) * kr;
          w.style.transform = `translate3d(${(bx + ox).toFixed(1)}px, ${oy.toFixed(1)}px, 0) rotate(${(ox * 0.012).toFixed(2)}deg) scale(${(1 + 0.035 * prox).toFixed(3)})`;
          v.playbackRate = clamp(rate, 0.25, 6);
          if (Math.abs(tx - ox) > 0.15 || Math.abs(ty - oy) > 0.15 || Math.abs(bxT - bx) > 0.15 || Math.abs(target - rate) > 0.02 || spd > 5) raf = requestAnimationFrame(frame);
        };
        const kick = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
        kickRef.current = kick;
        const move = (e) => {
          const now = performance.now();
          if (mx !== null && now > pt) spd = Math.max(spd * 0.5, Math.hypot(e.clientX - pmx, e.clientY - pmy) / ((now - pt) / 1000));
          pmx = e.clientX; pmy = e.clientY; pt = now; mx = e.clientX; my = e.clientY; kick();
        };
        const down = (e) => { held = true; move(e); };
        const up = () => { held = false; kick(); };
        const leave = () => { mx = null; kick(); };
        geo(); v.playbackRate = BASE;
        addEventListener('pointermove', move); addEventListener('pointerdown', down); addEventListener('pointerup', up); addEventListener('pointercancel', up);
        document.documentElement.addEventListener('mouseleave', leave); addEventListener('resize', geo);
        return () => { removeEventListener('pointermove', move); removeEventListener('pointerdown', down); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
          document.documentElement.removeEventListener('mouseleave', leave); removeEventListener('resize', geo); cancelAnimationFrame(raf); };
      }, []);
      useEffect(() => { if (kickRef.current) kickRef.current(); }, [open]);     // glide to / from the menu position

      return (
        <div className="relative min-h-screen flex flex-col overflow-hidden" style={{ fontFamily: "'Inter', sans-serif", background: 'var(--bg)' }}>
          <div ref={orb} className={'orbwrap' + (open ? ' menu' : '')} aria-hidden="true">
            <video ref={vid} className="orbvid" autoPlay loop muted playsInline preload="auto" src="assets/orb/orb.mp4" poster="assets/orb/orb.webp" />
          </div>

          {open && (
            <>
              <div className="fixed inset-0 z-50" style={{ background: 'var(--bg)', animation: 'sheetIn .35s ease both' }} aria-hidden="true" />
              <div className="fixed inset-0 z-[60] flex flex-col px-5 sm:px-8 pt-5 pb-8" style={{ animation: 'sheetIn .35s ease both' }} role="dialog" aria-label="Menu">
                <div className="flex items-center justify-between">
                  <Logo />
                  <button onClick={() => setOpen(false)} aria-label="Close" className="w-9 h-9 rounded-full bg-black text-white flex items-center justify-center"><X size={16} /></button>
                </div>
                <div className="flex flex-col gap-8 mt-[44vh] md:mt-16">
                  {LINKS.map((l) => <a key={l.label} href={l.href} target="_top" onClick={() => setOpen(false)} className={`text-3xl ${upper}`}>{l.label}</a>)}
                </div>
                <a href={SOCIAL} target="_top" className="mt-auto flex items-center gap-2 text-xl font-semibold uppercase tracking-widest" style={{ color: ACCENT }}>Get in touch <ArrowUpRight size={22} /></a>
              </div>
            </>
          )}

          <div className="relative z-10 flex flex-col min-h-screen">
            <nav className="flex items-center justify-between px-5 sm:px-8 md:px-12 pt-5 md:pt-6">
              <div style={down(0)}><Logo /></div>
              <div className="hidden md:flex items-center gap-10">
                {LINKS.map((l, i) => <a key={l.label} href={l.href} target="_top" className={`text-sm ${upper}`} style={down(i + 1)}>{l.label}</a>)}
              </div>
              <button onClick={() => setOpen(true)} aria-label="Menu" style={down(5)}
                className="w-9 h-9 rounded-full bg-black flex flex-col items-center justify-center gap-1">
                {[0, 1, 2].map((k) => <span key={k} className="w-4 h-0.5 bg-white" />)}
              </button>
            </nav>

            <div className="flex-1 flex items-center justify-end px-5 sm:px-8 md:px-12 py-8 md:py-0">
              <div className="flex gap-5 sm:gap-8 md:gap-10">
                {STATS.map(([n, label], i) => (
                  <div key={n} className="text-right" style={up(i + 2)}>
                    <div className="text-black font-semibold leading-none" style={{ fontSize: 'clamp(1.5rem, 5vw, 3.5rem)' }}>
                      <span style={{ color: ACCENT, fontSize: '0.5em' }}>+</span>{n}
                    </div>
                    <p className={`mt-2 text-[10px] sm:text-xs md:text-sm whitespace-pre-line leading-tight ${upper}`}>{label}</p>
                  </div>
                ))}
              </div>
            </div>

            <div className="px-5 sm:px-8 md:px-12 pb-8 md:pb-12 flex flex-col gap-6 md:gap-12">
              <div className="flex items-center justify-between gap-4">
                <p className={`text-[10px] sm:text-xs md:text-sm max-w-[130px] sm:max-w-[160px] md:max-w-xs ${upper}`} style={up(5)}>
                  Turning Messy<br />Ideas Into Human<br />Interfaces
                </p>
                <a href={SOCIAL} target="_top" className="flex items-center gap-1 text-base sm:text-xl md:text-2xl font-semibold whitespace-nowrap" style={{ ...up(6), color: ACCENT }}>
                  Get in touch <ArrowUpRight size={22} />
                </a>
              </div>

              <div className="flex items-end justify-between gap-3 sm:gap-4">
                <div className="w-[120px] sm:w-[180px] md:w-[280px] shrink-0" style={up(7)}>
                  <p className={`text-[9px] sm:text-xs md:text-sm text-left md:text-right ${upper}`}>A Product Designer &amp; UX Researcher, Making Products That Feel Human And Brands That Look Like Themselves</p>
                </div>
                <h1 className="text-right">
                  {WORDS.map((w, i) => (
                    <div key={w} className="overflow-hidden">
                      <div className="font-semibold uppercase text-black" style={{ fontSize: 'clamp(2rem, 9vw, 9rem)', lineHeight: 0.88, animation: `wordUp 0.7s ${EASE} ${0.4 + i * 0.14}s both` }}>{w}</div>
                    </div>
                  ))}
                </h1>
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
