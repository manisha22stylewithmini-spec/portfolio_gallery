<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foldcraft — Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { theme: { extend: { fontFamily: { geist: ['Geist', 'sans-serif'] } } } };</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; background: #000; }
    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .back-link {
      position: fixed; right: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.85);
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const Icon = ({ size = 24, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const ArrowRight = (p) => <Icon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    const LINKS = ['Home', 'Projects', 'Studio', 'Reach Us'];

    function App() {
      const [open, setOpen] = useState(false);
      const close = () => setOpen(false);
      return (
        <div className="relative h-screen w-full overflow-hidden bg-black font-geist">
          <video autoPlay muted loop playsInline className="absolute inset-0 h-full w-full object-cover" style={{ objectPosition: '70% center' }}
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260622_204221_5339e40b-e73d-4ab0-9c65-79c18c66fd50.mp4" />

          <div className={`absolute inset-x-0 top-0 z-20 overflow-hidden bg-black/98 backdrop-blur-xl transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] ${open ? 'h-screen opacity-100' : 'h-0 opacity-0 pointer-events-none'}`}>
            <div className={`flex h-full flex-col justify-center px-8 gap-6 transition-all duration-500 delay-100 ${open ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
              {LINKS.map((l) => <a key={l} href="#" onClick={close} className="text-3xl font-medium text-white/90 hover:text-white">{l}</a>)}
              <button onClick={close} className="mt-6 self-start rounded-full bg-white px-8 py-3.5 text-base font-medium text-black hover:scale-105 transition-transform">Let's Talk</button>
            </div>
          </div>

          <nav className="relative z-30 flex items-center justify-between px-6 py-5 md:px-12 lg:px-16">
            <div className="flex items-center gap-10">
              <span className="text-lg font-semibold tracking-tight text-white sm:text-xl">Foldcraft</span>
              <div className="hidden md:flex items-center gap-8">
                {LINKS.map((l) => <a key={l} href="#" className="text-sm text-white/80 hover:text-white transition-colors">{l}</a>)}
              </div>
            </div>
            <button className="hidden md:block rounded-lg bg-white px-5 py-2 text-sm font-medium text-black hover:scale-105 transition-transform">Let's Talk</button>
            <button onClick={() => setOpen(!open)} aria-label="Toggle menu" className="relative z-50 h-10 w-10 text-white active:scale-90 transition-transform md:hidden">
              <Menu className={`absolute inset-0 m-auto transition-all duration-300 ${open ? 'rotate-90 scale-50 opacity-0' : 'rotate-0 scale-100 opacity-100'}`} />
              <X className={`absolute inset-0 m-auto transition-all duration-300 ${open ? 'rotate-0 scale-100 opacity-100' : '-rotate-90 scale-50 opacity-0'}`} />
            </button>
          </nav>

          <div className="relative z-10 flex h-[calc(100vh-80px)] flex-col justify-between px-6 pb-10 pt-12 sm:pb-12 sm:pt-16 md:px-12 md:pb-16 md:pt-20 lg:px-16">
            <div className="max-w-3xl">
              <p className="mb-4 sm:mb-6 text-xs sm:text-sm text-white/90 animate-[fadeSlideUp_0.8s_ease_0.2s_both]">Brand & Visual Storytelling</p>
              <h1 className="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-medium leading-[1.1] tracking-tight text-white animate-[fadeSlideUp_0.8s_ease_0.4s_both]">
                Shaping visual<br />narratives,<br />one pixel at a time.
              </h1>
            </div>
            <div>
              <p className="text-sm sm:text-base md:text-lg leading-relaxed text-white/60 max-w-sm sm:max-w-lg mb-5 sm:mb-6 animate-[fadeSlideUp_0.8s_ease_0.7s_both]">
                Turning vision into reality through craft, motion, and an endless pursuit of beauty.
              </p>
              <button className="rounded-lg bg-white px-5 py-2.5 sm:px-6 sm:py-3 text-sm font-medium text-black hover:scale-105 transition-transform inline-flex items-center gap-2 animate-[fadeSlideUp_0.8s_ease_0.9s_both]">
                Explore Work <ArrowRight size={16} />
              </button>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
