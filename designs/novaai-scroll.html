<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA_AI — Today AI Aligns With Bold Dreams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    html, body { margin: 0; background: #0a0a0a; color: #fff; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgba(255,255,255,0.2); }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 70;
      font: 12px system-ui, sans-serif; color: #fff;
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.6);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const VIDEO = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260729_102822_0e6c87e8-c141-4744-bf32-ad30db296371.mp4';
    const PORTRAIT = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260728_050334_5b076e26-0ce7-4898-b432-d764190e448f.png&w=1280&q=85';

    const Icon = ({ size = 24, strokeWidth = 2, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Hexagon = (p) => <Icon {...p}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></Icon>;
    const ChevronRight = (p) => <Icon {...p}><path d="m9 18 6-6-6-6"/></Icon>;

    function Reveal({ children, delay = 0, className = '', as: Tag = 'div' }) {
      const ref = useRef(null);
      const [on, setOn] = useState(false);
      useEffect(() => {
        const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setOn(true); io.disconnect(); } }, { threshold: 0.15 });
        io.observe(ref.current);
        return () => io.disconnect();
      }, []);
      return (
        <Tag ref={ref} className={`will-change-transform ${on ? 'translate-y-0 opacity-100' : 'translate-y-8 opacity-0'} ${className}`}
          style={{ transition: 'all 700ms ease-out', transitionDelay: `${delay}ms` }}>{children}</Tag>
      );
    }

    function ScrollVideo() {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [hasFrame, setHasFrame] = useState(false);
      const [cacheReady, setCacheReady] = useState(false);
      const state = useRef({ frames: [], ready: false });

      useEffect(() => {
        const v = videoRef.current;
        const onLoaded = () => setHasFrame(true);
        v.addEventListener('loadeddata', onLoaded);
        return () => v.removeEventListener('loadeddata', onLoaded);
      }, []);

      // Extract a frame cache once the visible video has data
      useEffect(() => {
        if (!hasFrame) return;
        let cancelled = false;
        (async () => {
          await new Promise((r) => setTimeout(r, 300));
          const off = document.createElement('video');
          off.crossOrigin = 'anonymous'; off.muted = true; off.preload = 'auto'; off.playsInline = true; off.src = VIDEO;
          await new Promise((res, rej) => { off.onloadedmetadata = res; off.onerror = rej; }).catch(() => null);
          if (cancelled || !off.duration) return;
          const n = Math.max(24, Math.min(90, Math.floor(off.duration * 12)));
          const scale = Math.min(1, 960 / off.videoWidth);
          const w = Math.round(off.videoWidth * scale), h = Math.round(off.videoHeight * scale);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const cx = c.getContext('2d');
          const frames = [];
          try {
            for (let i = 0; i < n; i++) {
              if (cancelled) return;
              const t = (i / (n - 1)) * (off.duration - 0.05);
              await new Promise((res) => { off.onseeked = res; off.currentTime = t; });
              cx.drawImage(off, 0, 0, w, h);
              frames.push(await createImageBitmap(c));
            }
          } catch (e) { return; } // tainted / unsupported: keep seek fallback
          if (cancelled) return;
          state.current.frames = frames; state.current.ready = true;
          setCacheReady(true);
        })();
        return () => { cancelled = true; };
      }, [hasFrame]);

      useEffect(() => {
        const canvas = canvasRef.current, v = videoRef.current;
        const ctx = canvas.getContext('2d');
        let target = 0, smoothed = 0, raf = 0;
        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
        };
        const onScroll = () => {
          const max = document.documentElement.scrollHeight - innerHeight;
          target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
        };
        const cover = (src, sw, sh) => {
          const cw = canvas.width, ch = canvas.height, s = Math.max(cw / sw, ch / sh);
          const dw = sw * s, dh = sh * s;
          ctx.drawImage(src, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
        };
        const loop = () => {
          smoothed += (target - smoothed) * 0.12;
          const st = state.current;
          if (st.ready && st.frames.length) {
            const f = st.frames[Math.round(smoothed * (st.frames.length - 1))];
            cover(f, f.width, f.height);
          } else if (v.duration) {
            const t = smoothed * (v.duration - 0.05);
            if (Math.abs(v.currentTime - t) > 0.04) v.currentTime = t;
          }
          raf = requestAnimationFrame(loop);
        };
        resize(); onScroll();
        addEventListener('resize', resize); addEventListener('scroll', onScroll, { passive: true });
        raf = requestAnimationFrame(loop);
        return () => { cancelAnimationFrame(raf); removeEventListener('resize', resize); removeEventListener('scroll', onScroll); };
      }, []);

      return (
        <div className="fixed inset-0 z-0 bg-[#0a0a0a] overflow-hidden pointer-events-none">
          <video ref={videoRef} src={VIDEO} crossOrigin="anonymous" muted playsInline preload="auto"
            className={`absolute inset-0 h-full w-full object-cover transition-opacity duration-500 ${hasFrame && !cacheReady ? 'opacity-100' : 'opacity-0'}`} />
          <canvas ref={canvasRef} className={`absolute inset-0 h-full w-full transition-opacity duration-500 ${cacheReady ? 'opacity-100' : 'opacity-0'}`} />
        </div>
      );
    }

    const glassBadge = 'inline-block border-l-2 border-white bg-white/15 px-3 py-1.5 backdrop-blur-md font-mono text-[11px] uppercase tracking-[0.15em]';
    const h = 'text-5xl sm:text-6xl lg:text-7xl font-normal leading-[1.05] tracking-tight text-white drop-shadow-lg';
    const shell = 'flex flex-col justify-between min-h-screen supports-[height:100svh]:min-h-[100svh] px-5 sm:px-8 md:px-12 pt-24 sm:pt-28 pb-12 md:pb-16';

    function Navbar() {
      const links = ['Projects', 'About', 'Blog', 'Contact'];
      return (
        <header className="fixed top-0 left-0 right-0 z-50 border-b border-white/15">
          <div className="flex items-center justify-between px-5 sm:px-8 md:px-12 py-4">
            <Reveal className="flex items-center gap-2"><Hexagon size={24} strokeWidth={1.5} /><span className="text-lg sm:text-xl font-medium tracking-tight">novaai</span></Reveal>
            <nav className="hidden md:flex items-center gap-8 lg:gap-10">
              {links.map((l, i) => (
                <Reveal key={l} delay={100 + i * 100}>
                  <a href="#" className="text-sm text-white/85 hover:text-white transition-colors duration-300">
                    {l}{l === 'Projects' && <sup className="ml-0.5 font-mono text-[10px] text-white/60">6</sup>}
                  </a>
                </Reveal>
              ))}
            </nav>
            <Reveal delay={500}>
              <button className="rounded-md border border-white/20 bg-white/15 backdrop-blur-md px-4 py-2 text-xs sm:px-5 sm:text-sm hover:bg-white/25 transition-colors duration-300">Get Free Consultation</button>
            </Reveal>
          </div>
        </header>
      );
    }

    function SectionOne() {
      return (
        <section className={shell}>
          <div className="flex flex-col gap-8 sm:flex-row justify-between">
            <div className="flex flex-col gap-2">
              {['AI AUTOMATION', 'AI INTEGRATION', 'AI AGENT DEVELOPMENT'].map((s, i) => (
                <Reveal key={s} delay={150 + i * 120}><span className="font-mono text-xs uppercase tracking-[0.15em] text-white/90 drop-shadow-md">/ {s}</span></Reveal>
              ))}
            </div>
            <Reveal delay={300} className="max-w-xs sm:text-right">
              <p className="text-lg sm:text-xl leading-relaxed text-white drop-shadow-md">We design automation that brings clarity, precision, and efficiency to the way your company operates.</p>
            </Reveal>
          </div>
          <div className="flex flex-col gap-8 md:flex-row items-end justify-between mt-24">
            <div className="self-start md:self-end">
              <Reveal delay={150} className="mb-5"><span className={glassBadge}>We Automate 100+ Businesses</span></Reveal>
              <Reveal delay={280}><h1 className={h}>Clear. Precise.<br />Automated.</h1></Reveal>
            </div>
            <Reveal delay={420}>
              <div className="flex items-center gap-4 rounded-xl bg-white/15 p-3 backdrop-blur-md">
                <img src={PORTRAIT} alt="Mitha, co-founder of NovaAI" className="h-24 w-20 rounded-lg object-cover" />
                <div className="flex flex-col gap-1.5 pr-2">
                  <span className="text-sm font-medium text-white">Talk with Mitha</span>
                  <span className="font-mono text-[10px] uppercase tracking-[0.15em] text-white/60">Co-founder of NovaAI</span>
                  <button className="mt-1.5 flex items-center gap-1 self-start rounded-full bg-white px-4 py-2 text-xs font-medium text-black hover:bg-white/85 transition-colors duration-300">
                    Book 15-mins call <ChevronRight size={14} />
                  </button>
                </div>
              </div>
            </Reveal>
          </div>
        </section>
      );
    }

    const CAPS = [
      ['01', 'Real-time vision', 'Reads context as it happens and surfaces what matters before you ask.'],
      ['02', 'Layered insight', 'Moves from rough outline to sharp output without losing the thread.'],
      ['03', 'Adaptive speed', 'Learns your cadence and tightens every pass as you work.'],
    ];

    function SectionTwo() {
      return (
        <section className={shell}>
          <div className="flex flex-col gap-6 sm:flex-row justify-between">
            <Reveal delay={120}><span className={glassBadge}>Insight On Demand</span></Reveal>
            <Reveal delay={220} className="max-w-sm sm:text-right">
              <p className="text-lg sm:text-xl leading-relaxed text-white drop-shadow-md">Our AI doesn't just respond — it interprets, sharpens, and delivers the signal you need.</p>
            </Reveal>
          </div>
          <div className="flex flex-1 flex-col justify-end gap-12 md:flex-row items-end md:justify-between md:gap-16 mt-24">
            <div className="max-w-xl">
              <Reveal delay={180}><h2 className={h}>Learn to see<br />brilliantly.</h2></Reveal>
              <Reveal delay={320}><p className="mt-6 max-w-md text-sm sm:text-base text-white/80 drop-shadow-md">From the first sketch to the final render, Nova turns raw intent into decisions your team can act on — quietly, precisely, at speed.</p></Reveal>
              <Reveal delay={420} className="mt-8 flex flex-wrap gap-3">
                <button className="flex items-center gap-1 rounded-full bg-white px-5 py-2.5 text-xs sm:text-sm font-medium text-black hover:bg-white/85 transition-colors duration-300">Run the demo <ChevronRight size={14} /></button>
                <button className="rounded-full border border-white/25 bg-white/10 backdrop-blur-md px-5 py-2.5 text-xs sm:text-sm hover:bg-white/20 transition-colors duration-300">Free consultation</button>
              </Reveal>
            </div>
            <div className="w-full max-w-md rounded-2xl border border-white/15 bg-white/10 backdrop-blur-md px-5 sm:px-6">
              {CAPS.map(([n, t, b], i) => (
                <Reveal key={n} delay={300 + i * 110} className={`group flex gap-5 py-5 ${i < CAPS.length - 1 ? 'border-b border-white/15' : ''}`}>
                  <span className="font-mono text-[11px] tracking-[0.15em] text-white/55 pt-1.5">{n}</span>
                  <div>
                    <div className="flex items-center gap-1 text-base sm:text-lg font-medium text-white">{t}
                      <ChevronRight size={16} className="text-white/40 transition-all group-hover:translate-x-0.5 group-hover:text-white" />
                    </div>
                    <p className="mt-1.5 text-sm leading-relaxed text-white/70">{b}</p>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <div className="relative">
        <ScrollVideo />
        <div className="relative z-10">
          <Navbar />
          <main><SectionOne /><div className="h-[80vh]" aria-hidden="true" /><SectionTwo /></main>
        </div>
      </div>
    );
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
