<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Product designer</title>
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/08e020de1811ec4489f82d1247a42c09?family=Helvetica+Now+Text">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    * { font-family: 'Helvetica Now Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: #000; }
    /* the film is shot on pure black, so it can sit off to the right (on wide screens) and the words get the quiet side;
       on a phone it rests in the lower part of the screen under the words */
    .bgwrap { position: absolute; inset: 0; transform: translateX(15vw); }
    .bgwrap video { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
    @media (max-width: 767px) { .bgwrap { transform: none; top: auto; height: 66%; } .bgwrap video { object-position: 50% 60%; } }
    .tx { text-shadow: 0 2px 24px rgba(0,0,0,.55); }
    .logo-dark { height: 46px; width: auto; display: block; }
    @media (min-width: 640px) { .logo-dark { height: 56px; } }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes dropdown-in {
      from { opacity: 0; transform: translateY(-4px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-dropdown { animation: dropdown-in 0.2s ease-out; }
    .duration-400 { transition-duration: 400ms; }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.85);
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const Icon = ({ className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const ChevronDown = (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>;
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    const SOCIAL = 'shelf-library.html#social';          // every sticker on the social calendar opens a chat with me
    const NAV = [
      { label: 'Home', href: 'shelf-library.html#home' },
      { label: 'Work', href: 'shelf-library.html#library' },
      { label: 'About', href: 'halcyon-hero.html' },     // the design-POV journey tells who I am
      { label: 'Social', href: SOCIAL },
    ];

    const Logo = () => (
      <a href="#" aria-label="Manisha Baroliya" className="block"><img src="assets/logo-dark.webp" alt="Manisha Baroliya" width="380" height="199" className="logo-dark" /></a>
    );

    function App() {
      const [mobile, setMobile] = useState(false);

      return (
        <section className="relative w-full overflow-hidden flex flex-col bg-black" style={{ height: '100dvh' }}>
          {/* the glowing mushrooms, looping forward, on pure black */}
          <div className="bgwrap" aria-hidden="true">
            <video autoPlay loop muted playsInline preload="auto" src="assets/glow/glow.mp4" poster="assets/glow/glow.webp" />
          </div>
          <div className="absolute inset-0 pointer-events-none" style={{ background: 'linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.18) 45%, transparent 70%)' }} />

          <nav className="relative z-30 flex items-center justify-between px-5 sm:px-6 md:px-12 lg:px-16 py-4 sm:py-5">
            <div className="flex items-center gap-10">
              <Logo />
              <div className="hidden md:flex items-center gap-7">
                {NAV.map((n) => <a key={n.label} href={n.href} target="_top" className="text-white/90 hover:text-white text-sm font-medium py-2 transition-colors">{n.label}</a>)}
              </div>
            </div>

            <div className="hidden md:flex items-center gap-5">
              <a href={SOCIAL} target="_top" className="liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium">Get in touch</a>
            </div>

            <button onClick={() => setMobile(!mobile)} aria-label="Toggle menu" className="md:hidden relative w-9 h-9 text-white">
              <Menu className={`absolute inset-0 m-auto w-6 h-6 transition-all duration-300 ${mobile ? 'rotate-90 scale-50 opacity-0' : 'opacity-100'}`} />
              <X className={`absolute inset-0 m-auto w-6 h-6 transition-all duration-300 ${mobile ? 'opacity-100' : '-rotate-90 scale-50 opacity-0'}`} />
            </button>

            <div className={`md:hidden absolute top-full left-4 right-4 mt-2 bg-[#14100d]/95 backdrop-blur-xl rounded-2xl p-6 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${mobile ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
              {NAV.map((n) => <a key={n.label} href={n.href} target="_top" onClick={() => setMobile(false)} className="block mb-4 text-white text-lg font-medium">{n.label}</a>)}
              <div className="border-t border-white/10 pt-4">
                <a href={SOCIAL} target="_top" className="inline-block liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium">Get in touch</a>
              </div>
            </div>
          </nav>

          <div className="relative z-10 flex-1 flex items-start md:items-center px-5 sm:px-6 md:px-12 lg:px-16 pt-10 sm:pt-14 md:pt-0 pb-10">
            <div className="max-w-xl lg:max-w-2xl">
              <p className="tx text-[11px] sm:text-xs uppercase tracking-[0.22em] text-white/60 mb-4 sm:mb-6">Product designer &amp; UX researcher</p>
              <h1 className="tx text-white text-4xl sm:text-5xl md:text-6xl xl:text-7xl leading-[1.05] tracking-[-0.02em]">
                Designing products <span className="text-white/60">people actually understand.</span>
              </h1>
              <p className="tx text-white/80 text-sm sm:text-base md:text-lg leading-relaxed max-w-md mt-6 sm:mt-8">
                I'm Manisha. I turn complex, multi-role workflows into clean, human interfaces, grounded in research and a psychology-led approach.
              </p>
              <div className="flex flex-wrap items-center gap-3 sm:gap-4 mt-6 sm:mt-8">
                <a href="shelf-library.html#library" target="_top" className="px-5 sm:px-6 py-2.5 sm:py-3 bg-white text-gray-900 text-sm font-semibold rounded-full hover:bg-white/90">View my work</a>
                <a href={SOCIAL} target="_top" className="px-5 sm:px-6 py-2.5 sm:py-3 liquid-glass rounded-full text-white text-sm font-semibold hover:bg-white/10">Get in touch</a>
              </div>
              <p className="tx hidden sm:block text-white/50 text-xs sm:text-sm mt-8 sm:mt-10">3+ years · 20+ live designs · 10+ SaaS &amp; B2B platforms</p>
            </div>
          </div>
        </section>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
