<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flowpath — Hero</title>
  <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/08e020de1811ec4489f82d1247a42c09?family=Helvetica+Now+Text">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    * { font-family: 'Helvetica Now Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { margin: 0; background: #000; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    @keyframes dropdown-in {
      from { opacity: 0; transform: translateY(-4px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-dropdown { animation: dropdown-in 0.2s ease-out; }
    .duration-400 { transition-duration: 400ms; }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.85);
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState } = React;
    const Icon = ({ className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const ChevronDown = (p) => <Icon {...p}><path d="m6 9 6 6 6-6"/></Icon>;
    const Menu = (p) => <Icon {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></Icon>;
    const X = (p) => <Icon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></Icon>;

    const NAV = [
      { label: 'Product', items: ['Connections', 'Workflows', 'Insights'] },
      { label: 'Solutions', items: ['Guides', 'Use cases', 'API reference'] },
      { label: 'About', items: ['Our story', 'Open roles', 'Reach us'] },
      { label: 'Plans', items: [] },
    ];

    const Logo = () => (
      <div className="flex items-center gap-2">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 2 26 14 14 26 2 14Z" fill="white" opacity="0.9" />
          <path d="M14 8 20 14 14 20 8 14Z" fill="white" opacity="0.5" />
        </svg>
        <span className="text-white text-lg sm:text-xl font-medium tracking-tight">flowpath</span>
      </div>
    );

    function App() {
      const [openDrop, setOpenDrop] = useState(null);
      const [mobile, setMobile] = useState(false);

      return (
        <section className="relative h-screen w-full overflow-hidden flex flex-col bg-black">
          <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover"
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260703_053131_1ec3dd1c-d627-44fb-ab20-6e1fce41b0d5.mp4" />
          <div className="absolute inset-0 bg-black/10" />

          <nav className="relative z-30 flex items-center justify-between px-5 sm:px-6 md:px-12 lg:px-16 py-4 sm:py-5">
            <div className="flex items-center gap-10">
              <Logo />
              <div className="hidden md:flex items-center gap-7">
                {NAV.map((n) => (
                  <div key={n.label} className="relative" onMouseEnter={() => setOpenDrop(n.label)} onMouseLeave={() => setOpenDrop(null)}>
                    <button className="flex items-center gap-1 text-white/90 hover:text-white text-sm font-medium py-2">
                      {n.label}
                      {n.items.length > 0 && <ChevronDown className={`w-3.5 h-3.5 transition-transform duration-200 ${openDrop === n.label ? 'rotate-180' : ''}`} />}
                    </button>
                    {n.items.length > 0 && openDrop === n.label && (
                      <div className="animate-dropdown liquid-glass !absolute top-full left-0 rounded-xl py-3 px-2 min-w-[160px] shadow-xl">
                        {n.items.map((it) => <a key={it} href="#" className="block px-3 py-2 text-white/80 hover:text-white text-sm rounded-lg hover:bg-white/5">{it}</a>)}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>

            <div className="hidden md:flex items-center gap-5">
              <a href="#" className="text-white/90 hover:text-white text-sm font-medium">Log in</a>
              <button className="liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium">Try it free</button>
            </div>

            <button onClick={() => setMobile(!mobile)} aria-label="Toggle menu" className="md:hidden relative w-9 h-9 text-white">
              <Menu className={`absolute inset-0 m-auto w-6 h-6 transition-all duration-300 ${mobile ? 'rotate-90 scale-50 opacity-0' : 'opacity-100'}`} />
              <X className={`absolute inset-0 m-auto w-6 h-6 transition-all duration-300 ${mobile ? 'opacity-100' : '-rotate-90 scale-50 opacity-0'}`} />
            </button>

            <div className={`md:hidden absolute top-full left-4 right-4 mt-2 bg-[#2C221C]/95 backdrop-blur-xl rounded-2xl p-6 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] ${mobile ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
              {NAV.map((n) => (
                <div key={n.label} className="mb-4">
                  <a href="#" className="text-white text-lg font-medium">{n.label}</a>
                  {n.items.map((it) => <a key={it} href="#" className="block pl-4 pt-2 text-white/70 text-sm">{it}</a>)}
                </div>
              ))}
              <div className="border-t border-white/10 pt-4 flex items-center justify-between">
                <a href="#" className="text-white/90 text-sm font-medium">Log in</a>
                <button className="liquid-glass rounded-full px-5 py-2 text-white text-sm font-medium">Try it free</button>
              </div>
            </div>
          </nav>

          <div className="relative z-10 flex-1 flex items-start justify-center px-5 pt-16 sm:pt-20 md:pt-24">
            <div className="text-center max-w-3xl">
              <h1 className="text-white text-3xl sm:text-4xl md:text-5xl lg:text-6xl xl:text-7xl leading-[1.05] tracking-[-0.02em]">
                Bridge the<br />gaps. <span className="text-white/60">Ditch the</span><br /><span className="text-white/60">grindwork.</span>
              </h1>
              <p className="text-white/80 text-sm sm:text-base md:text-lg leading-relaxed max-w-md mx-auto mt-6 sm:mt-8">
                Flowpath unifies your complete wellness tools, so your crew spends less energy plugging gaps and more on real progress.
              </p>
              <div className="flex flex-wrap items-center justify-center gap-3 sm:gap-4 mt-6 sm:mt-8">
                <button className="px-5 sm:px-6 py-2.5 sm:py-3 bg-white text-gray-900 text-sm font-semibold rounded-full hover:bg-white/90">Begin your journey</button>
                <button className="px-5 sm:px-6 py-2.5 sm:py-3 liquid-glass rounded-full text-white text-sm font-semibold hover:bg-white/10">See it live</button>
              </div>
            </div>
          </div>
        </section>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
