<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";

const HEAD_GLB = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_172206_0181329a-86e2-41c9-8ab8-c496f29aaa53.glb";
const ARM_GLB  = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261018_172137_cd6086ec-07ef-44dc-bd15-95a450ddaa8c.glb";

// menu
const nav = document.getElementById("nav"), menuBtn = document.getElementById("menuBtn");
menuBtn.addEventListener("click", () => { const o = nav.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", String(o)); });

const hero = document.getElementById("hero"), canvas = document.getElementById("stage"), loaderEl = document.getElementById("loader");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0b11);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

function radialTexture(stops, size = 256) {
  const c = document.createElement("canvas"); c.width = c.height = size;
  const x = c.getContext("2d"), g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(([o, col]) => g.addColorStop(o, col));
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = radialTexture([[0, "rgba(160,120,255,1)"], [0.25, "rgba(124,77,255,.55)"], [0.6, "rgba(90,50,230,.12)"], [1, "rgba(60,30,200,0)"]]);

// dark studio environment: round emissive softboxes
{
  const envScene = new THREE.Scene(); envScene.background = new THREE.Color(0x030305);
  const sb = (color, k, w, h, pos) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k) }));
    m.scale.set(w, h, 0.3); m.position.set(...pos); m.lookAt(0, 0, 0); envScene.add(m);
  };
  sb(0xffffff, 3.2, 5, 3.2, [-3, 4.5, 4]); sb(0xffffff, 1.1, 1.2, 6, [6, 0.5, 2]); sb(0xffffff, 0.8, 3, 1, [1.5, 5, -1]);
  sb(0x7c4dff, 1.0, 4, 5, [-5, 0, -4]); sb(0x7c4dff, 1.0, 4, 5, [5, 0, -4]); sb(0x5b30ff, 0.35, 6, 3, [0, -5, 1]);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.02).texture; scene.environmentIntensity = 1.0;
}
const hemi = new THREE.HemisphereLight(0xeeeaff, 0x2a1a5a, 1.6); scene.add(hemi);
const dl = new THREE.DirectionalLight(0xfff6ee, 1.15); dl.position.set(-3, 4, 5); scene.add(dl);
const rimL = new THREE.DirectionalLight(0x9b7bff, 0.8); rimL.position.set(3.5, 2.5, -4); scene.add(rimL);
const fillL = new THREE.DirectionalLight(0xc8d4ff, 0.35); fillL.position.set(4, -1, 3); scene.add(fillL);

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.4, 0.92); composer.addPass(bloom);
composer.addPass(new OutputPass());

function rimMaterial(color, power, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { c: { value: new THREE.Color(color) }, p: { value: power }, s: { value: strength } },
    vertexShader: "varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }",
    fragmentShader: "uniform vec3 c; uniform float p; uniform float s; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - max(dot(normalize(vN), normalize(vV)), 0.0), p); gl_FragColor = vec4(c * f * s, f); }",
    blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
  });
}

// rig: robot (float/bob/intro) -> body (partial turn, holds arms) -> head (full turn)
const robot = new THREE.Group(), body = new THREE.Group(), head = new THREE.Group();
robot.add(body); body.add(head); scene.add(robot);

const haze = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0x7a55ff, opacity: 0.06, blending: THREE.AdditiveBlending, toneMapped: false, depthWrite: false }));
haze.scale.setScalar(7.5); haze.position.set(0, 0.1, -3); scene.add(haze);
const floorGlow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: glowTex, color: 0x8f6bff, opacity: 0.95, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
floorGlow.position.set(0, -2.05, -0.6); floorGlow.scale.set(3.4, 0.42, 1); scene.add(floorGlow);

function prepareModel(root, { glossy, rim, tint, useMap, smooth }) {
  const meshes = []; root.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const m of meshes) {
    if (smooth) {
      let g = m.geometry.clone();
      ["normal", "uv", "uv1", "tangent", "color"].forEach((a) => g.deleteAttribute(a));
      g = mergeVertices(g, 1e-3); g.computeVertexNormals(); m.geometry = g;
    }
    const old = m.material;
    m.material = new THREE.MeshPhysicalMaterial(Object.assign({ map: useMap ? old.map : null, color: new THREE.Color(tint) },
      glossy ? { metalness: 0.1, roughness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.16, envMapIntensity: 0.9 }
             : { metalness: 0, roughness: 0.48, clearcoat: 0.3, clearcoatRoughness: 0.4, envMapIntensity: 0.55 }));
    if (rim) { const sh = new THREE.Mesh(m.geometry, rimMaterial(rim.color, rim.power, rim.strength)); sh.renderOrder = 2; m.add(sh); }
  }
}

function normaliseHead(root) {
  root.updateMatrixWorld(true);
  const size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  root.scale.setScalar(2 / size.z); root.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(root), c = b.getCenter(new THREE.Vector3());
  root.position.set(-c.x, -(b.min.y + 1), -c.z);
  return root;
}
function normaliseArm(root) {
  root.updateMatrixWorld(true);
  const size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  root.scale.setScalar(0.78 / size.y); root.updateMatrixWorld(true);

}

function roundedRect(w, h, r) {

const eyes = [], cheeks = [], sparkles = []; let mouth = null, happyUntil = 0;
const blinkState = { next: 2.5 + Math.random() * 3.5, t0: -1 };

function mountHead(root) {
  head.add(root); head.updateMatrixWorld(true);

  const rc = new THREE.Raycaster(new THREE.Vector3(0, 0, 5), new THREE.Vector3(0, 0, -1));
  const hits = rc.intersectObject(root, true);
  const R = clamp(hits.length ? 5 - hits[0].distance : 1, 0.85, 1.1);
  const inv = head.matrixWorld.clone().invert();
  const tops = [];
  // b) perfectly smooth sphere normals + collect vertices for the antenna balls
  root.traverse((m) => {
    if (!m.isMesh) return;
    m.updateWorldMatrix(true, false);
    const A = inv.clone().multiply(m.matrixWorld), n3 = new THREE.Matrix3().setFromMatrix4(A).transpose();
    const pa = m.geometry.attributes.position, na = m.geometry.attributes.normal, v = new THREE.Vector3(), n = new THREE.Vector3();
    for (let i = 0; i < pa.count; i++) {

      if (na && Math.abs(v.length() - R) < 0.07 * R) { n.copy(v).normalize().applyMatrix3(n3).normalize(); na.setXYZ(i, n.x, n.y, n.z); }
    }

    new THREE.MeshPhysicalMaterial({ color: 0x0c0c10, roughness: 0.3, metalness: 0.3, clearcoat: 0.8, polygonOffset: true, polygonOffsetFactor: -6, polygonOffsetUnits: -6 }), 3));
  head.add(curvedPlate(1.74, 1.0, 0.4, -0.07, R * 1.036,
    new THREE.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.1, envMapIntensity: 0.9, polygonOffset: true, polygonOffsetFactor: -8, polygonOffsetUnits: -8 }), 4));
  // d) eyes
  const irisTex = radialTexture([[0, "#d7c9ff"], [0.45, "#a07bff"], [0.8, "#7646f2"], [1, "#5c2fe0"]]);
  const eyeMat = (o) => new THREE.MeshBasicMaterial(Object.assign({ toneMapped: false, depthWrite: false, depthTest: false }, o));
  for (const sx of [-1, 1]) {
    const x = 0.43 * sx, y = -0.08, z = Math.sqrt(Math.max((R * 1.055) ** 2 - x * x - y * y, 0));
    const g = new THREE.Group(); g.position.set(x, y, z); g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), g.position.clone().normalize());
    const add = (geo, mat, zz, order) => { const m = new THREE.Mesh(geo, mat); m.position.z = zz; m.renderOrder = order; g.add(m); return m; };
    g.scale.setScalar(1.24);
    add(new THREE.CircleGeometry(0.42, 48), eyeMat({ map: glowTex, color: 0x8a5cff, opacity: 0.24, transparent: true, blending: THREE.AdditiveBlending }), -0.004, 9);
    add(new THREE.RingGeometry(0.168, 0.212, 64), eyeMat({ color: new THREE.Color(1.1, 0.88, 2.0) }), 0, 10);
    add(new THREE.CircleGeometry(0.17, 48), eyeMat({ map: irisTex, color: new THREE.Color(1.0, 0.95, 1.15) }), 0.001, 10);
    const pw = new THREE.Group(); g.add(pw);
    const p1 = new THREE.Mesh(new THREE.CircleGeometry(0.083, 40), eyeMat({ color: 0x07040f })); p1.position.z = 0.003; p1.renderOrder = 10; pw.add(p1);
    const p2 = new THREE.Mesh(new THREE.CircleGeometry(0.022, 24), eyeMat({ color: 0xffffff })); p2.position.set(0.036, 0.04, 0.005); p2.scale.setScalar(1.35);
    const p3 = new THREE.Mesh(new THREE.CircleGeometry(0.012, 16), eyeMat({ color: 0xffffff })); p3.position.set(-0.03, -0.035, 0.005); p3.renderOrder = 10; pw.add(p3); p2.renderOrder = 10; pw.add(p2);
    head.add(g); eyes.push({ g, pw });
  }
  // e) antenna balls
  for (const sx of [-1, 1]) {
    const side = tops.filter((v) => Math.sign(v.x) === sx); if (!side.length) continue;
    const top = side.reduce((a, b) => (b.y > a.y ? b : a));
    const near = side.filter((v) => v.distanceTo(top) < 0.2), c = new THREE.Vector3();
    near.forEach((v) => c.add(v)); c.divideScalar(near.length); c.y = Math.max(c.y, top.y - 0.1);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.145, 32, 16), new THREE.MeshPhysicalMaterial({ color: 0xff8fd0, emissive: 0xff5fb8, emissiveIntensity: 1.7, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.14 }));
    ball.position.copy(c); head.add(ball);
    const gl = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xff8ad8, opacity: 0.85, blending: THREE.AdditiveBlending, toneMapped: false, depthWrite: false }));

}
const antennaGlows = [];

function fallbackHead() {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({ color: 0xc4c4d2, roughness: 0.26, clearcoat: 1 });
  const rim = () => rimMaterial(0x8a5cff, 4.5, 0.32);
  const add = (geo, m, pos, rot) => { const mesh = new THREE.Mesh(geo, m); if (pos) mesh.position.set(...pos); if (rot) mesh.rotation.set(...rot); g.add(mesh); const sh = new THREE.Mesh(geo, rim()); sh.renderOrder = 2; mesh.add(sh); return mesh; };
  add(new THREE.SphereGeometry(1, 64, 48), mat, [0, 0, 0]);
  add(new THREE.CylinderGeometry(0.22, 0.22, 0.2, 32), mat, [-1.02, 0, 0], [0, 0, Math.PI / 2]); add(new THREE.CylinderGeometry(0.22, 0.22, 0.2, 32), mat, [1.02, 0, 0], [0, 0, Math.PI / 2]);
  add(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 12), mat, [-0.5, 1.15, 0], [0, 0, 0.22]); add(new THREE.CylinderGeometry(0.035, 0.035, 0.5, 12), mat, [0.5, 1.15, 0], [0, 0, -0.22]);
  return g;
}
function fallbackArm() {
  const geo = new THREE.CapsuleGeometry(0.22, 0.42, 8, 24), g = new THREE.Group();
  const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xb0b0c0, roughness: 0.48 })); g.add(m);
  const sh = new THREE.Mesh(geo, rimMaterial(0x8a5cff, 2.6, 1.05)); sh.renderOrder = 2; m.add(sh); return g;
}

const arms = [];
function mountArms(tpl) {
  let pair;
  if (tpl) { prepareModel(tpl, { glossy: false, useMap: false, smooth: true, tint: "#b4b4c4", rim: { color: 0x8a5cff, power: 2.6, strength: 0.9 } }); pair = [tpl, tpl.clone(true)].map(normaliseArm); }
  else pair = [fallbackArm(), fallbackArm()];
  const rest = [{ x: -1.32, y: -0.72, z: 0.15, rz: -0.62, phase: 0 }, { x: 1.32, y: -0.72, z: 0.15, rz: 0.62, phase: Math.PI * 0.85 }];
  pair.forEach((a, i) => { const r = rest[i]; a.position.set(r.x, r.y, r.z); a.rotation.z = r.rz; body.add(a); arms.push({ a, ...r }); });
}

const loader = new GLTFLoader();
const load = (url) => new Promise((res, rej) => loader.load(url, (g) => res(g.scene), undefined, rej));

let intro = 0, started = false;
// High-detail procedural robot: a perfect pearl sphere, bevelled ear pods with a glowing ring,
// chrome antenna stems and smooth lathe-turned arms (no faceting at any size).
const pearl = (hex, rough = 0.2) => new THREE.MeshPhysicalMaterial({ color: new THREE.Color(hex), metalness: 0.05, roughness: rough, clearcoat: 1, clearcoatRoughness: 0.06, iridescence: 0.18, iridescenceIOR: 1.3, sheen: 0.4, sheenColor: new THREE.Color(0xb9a6ff), sheenRoughness: 0.5, envMapIntensity: 1.0 });

function buildHead() {
  const g = new THREE.Group();
  g.add(withRim(new THREE.Mesh(new THREE.SphereGeometry(1, 160, 120), pearl("#ebe9f4", 0.18)), 0.28));
  const podProfile = [[0, 0], [0.235, 0], [0.262, 0.012], [0.272, 0.045], [0.272, 0.13], [0.258, 0.165], [0.22, 0.188], [0.12, 0.2], [0, 0.202]].map(([x, y]) => new THREE.Vector2(x, y));
  const podGeo = new THREE.LatheGeometry(podProfile, 96);
  for (const sx of [-1, 1]) {
    const pod = new THREE.Group();
    pod.add(withRim(new THREE.Mesh(podGeo, pearl("#cdc8e2", 0.24)), 0.35));
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.014, 24, 96), new THREE.MeshStandardMaterial({ color: 0xb48cff, emissive: 0x7c4dff, emissiveIntensity: 0.9, roughness: 0.3 }));
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.205; pod.add(ring);
    pod.position.x = sx * 0.9; pod.rotation.z = -sx * Math.PI / 2; g.add(pod);
  }
  const chrome = new THREE.MeshPhysicalMaterial({ color: 0xf2f0fa, metalness: 0.25, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.1 });
  for (const sx of [-1, 1]) {
    const dir = new THREE.Vector3(sx * 0.48, 0.86, 0.1).normalize();
    const base = new THREE.Group(); base.position.copy(dir.clone().multiplyScalar(0.97)); base.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.09, 64), new THREE.MeshPhysicalMaterial({ color: 0x8e6cff, roughness: 0.25, clearcoat: 1, metalness: 0.2 }));
    collar.position.y = 0.04; base.add(collar);
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.04, 0.46, 32), chrome); rod.position.y = 0.3; base.add(rod);
    g.add(base);

}
function buildArm() {
  const pts = []; for (let i = 0; i <= 64; i++) { const t = i / 64, r = 0.2 * Math.sqrt(Math.sin(Math.PI * t)) * (1.08 - 0.16 * t); pts.push(new THREE.Vector2(Math.max(r, 0.0001), -0.39 + 0.78 * t)); }

  const g = new THREE.Group(); g.add(withRim(new THREE.Mesh(geo, pearl("#d5d2e4", 0.22)), 0.6)); return g;
}
Promise.resolve().then(() => {
  const headRoot = buildHead();
  mountHead(headRoot);
  const rest = [{ x: -1.32, y: -0.72, z: 0.15, rz: -0.62, phase: 0 }, { x: 1.32, y: -0.72, z: 0.15, rz: 0.62, phase: Math.PI * 0.85 }];
  rest.forEach((r) => { const a = buildArm(); a.position.set(r.x, r.y, r.z); a.rotation.z = r.rz; body.add(a); arms.push({ a, ...r }); });
  loaderEl.classList.add("hide"); robot.scale.setScalar(0.001); started = true;
});
if (false) Promise.allSettled([load(HEAD_GLB), load(ARM_GLB)]).then(([h, a]) => {
  let headRoot;
  if (h.status === "fulfilled") {
    headRoot = normaliseHead(h.value);
    prepareModel(headRoot, { glossy: true, useMap: false, tint: "#d6d6e2", rim: { color: 0x8a5cff, power: 4.5, strength: 0.32 } });
  } else headRoot = fallbackHead();
  mountHead(headRoot);
  mountArms(a.status === "fulfilled" ? a.value : null);
  loaderEl.classList.add("hide"); robot.scale.setScalar(0.001); started = true;
});

// layout
let W = 1, H = 1, anchor = { x: 0, y: 0 }, mobile = false;
function layout() {
  const r = hero.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
  mobile = W <= 860;
  renderer.setSize(W, H, false); composer.setSize(W, H); composer.setPixelRatio(renderer.getPixelRatio()); bloom.setSize(W, H);
  let robotPx;
  if (!mobile) { robotPx = Math.min(H * 0.7, W * 0.44, 720); anchor = { x: W * 0.695, y: H * 0.5 + 8 }; }
  else {
    const copy = hero.querySelector(".copy").getBoundingClientRect(), copyTop = copy.top - r.top, room = Math.max(copyTop - 62, 220);
    robotPx = Math.min(room * 1.0, W * 0.9); anchor = { x: W / 2, y: 62 + room * 0.5 };
  }
  camera.aspect = W / H;
  camera.position.z = (3.4 * H) / (robotPx * 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  camera.setViewOffset(W, H, W / 2 - anchor.x, H / 2 - anchor.y, W, H); camera.updateProjectionMatrix();
  loaderEl.style.left = anchor.x + "px"; loaderEl.style.top = anchor.y + "px";
}
new ResizeObserver(layout).observe(hero); layout();

// pointer
const target = { x: 0, y: 0 }, look = { x: 0, y: 0 }; let lastMove = -10;
function onMove(cx, cy) {
  const r = hero.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  const rx = mobile ? W * 0.5 : Math.max(W * 0.55, 500), ry = mobile ? H * 0.5 : Math.max(H * 0.55, 400);
  target.x = clamp((px - anchor.x) / rx, -1.2, 1.2); target.y = clamp((py - anchor.y) / ry, -1.2, 1.2); lastMove = clock.getElapsedTime();
}
const clock = new THREE.Clock();
function applyTheme(light) {
  scene.background = light ? new THREE.Color(7, 7, 7.5) : new THREE.Color(0x0b0b11);
  bloom.threshold = light ? 9 : 1.0; bloom.strength = light ? 0.2 : 0.55;
  haze.material.opacity = light ? 0 : 0.06;
  floorGlow.material.blending = light ? THREE.NormalBlending : THREE.AdditiveBlending;
  floorGlow.material.color.set(light ? 0x2a1c6e : 0x8f6bff); floorGlow.userData.base = light ? 0.34 : 0.95; floorGlow.userData.light = light;
  floorGlow.material.needsUpdate = true;
}
const themeBtn = document.getElementById("themeBtn");
const isLight = () => document.documentElement.dataset.theme === "light";
applyTheme(isLight());
themeBtn.addEventListener("click", () => {
  const next = isLight() ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("rh-theme", next); } catch (e) {}
  applyTheme(next === "light");
});
addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY));
addEventListener("pointerdown", (e) => { onMove(e.clientX, e.clientY); const dx = e.clientX - (hero.getBoundingClientRect().left + anchor.x), dy = e.clientY - (hero.getBoundingClientRect().top + anchor.y); if (Math.hypot(dx, dy) < Math.min(W, H) * 0.3) happyUntil = clock.getElapsedTime() + 0.7; });
addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) onMove(t.clientX, t.clientY); }, { passive: true });

let visible = true; new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(hero);

let prev = 0;
function frame() {
  requestAnimationFrame(frame);
  if (!visible) return;
  const t = clock.getElapsedTime(), dt = Math.min(0.05, t - prev); prev = t;
  if (t - lastMove > 3.5) { target.x = Math.sin(t * 0.45) * 0.45; target.y = Math.sin(t * 0.31 + 1.2) * 0.2; }
  const k = 1 - Math.pow(0.0025, dt); look.x += (target.x - look.x) * k; look.y += (target.y - look.y) * k;
  if (started && intro < 1) { intro = Math.min(1, intro + dt * 1.4); const q = intro - 1; robot.scale.setScalar(Math.max(0.001, 1 + 2.4 * q * q * q + 1.4 * q * q)); }
  const m = reduced ? 0.25 : 1, hop = t < happyUntil ? Math.sin(((happyUntil - t) / 0.7) * Math.PI) * 0.22 : 0, bob = Math.sin(t * 1.6) * 0.09 * m + hop;
  robot.position.y = bob;
  head.rotation.set(look.y * 0.42, look.x * 0.5, -look.x * 0.06 + 0.07 + Math.sin(t * 1.1) * 0.02 * m);
  body.rotation.set(look.y * 0.12, look.x * 0.28, 0);
  for (const r of arms) {
    const s = Math.sign(r.x), w = Math.sin(t * 2.0 + r.phase);
    r.a.position.y = r.y + w * 0.13 * m - bob * 0.35; r.a.position.x = r.x + s * look.x * -0.04;
    r.a.rotation.z = r.rz + w * 0.12 * s * m; r.a.rotation.x = Math.sin(t * 1.3 + r.phase) * 0.08;
  }
  for (const e of eyes) e.pw.position.set(clamp(look.x * 0.075, -0.07, 0.07), clamp(-look.y * 0.06, -0.06, 0.06), 0);
  if (blinkState.t0 < 0 && t > blinkState.next) blinkState.t0 = t;
  let sy = 1;
  if (blinkState.t0 >= 0) { const p = (t - blinkState.t0) / 0.32; if (p >= 1) { blinkState.t0 = -1; blinkState.next = t + 2.5 + Math.random() * 3.5; } else sy = 1 - 0.92 * (1 - Math.abs(p * 2 - 1)); }
  for (const e of eyes) e.g.scale.y = (t < happyUntil ? 0.55 : 1) * sy * 1.0;
  floorGlow.scale.set(3.4 - bob * 3, 0.42 - bob * 0.4, 1); floorGlow.material.opacity = floorGlow.userData.light ? 0.3 + (0.09 - bob) * 0.8 : 0.7 + (0.09 - bob) * 1.5;
  for (const g of antennaGlows) g.material.opacity = 0.7 * (0.85 + Math.sin(t * 1.6) * 0.15) + 0.15;
  composer.render();
}
frame();
</script>
