<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>/* When a preview opens this file as an inline data: page there is no folder to resolve assets/, posters/ or links from, and the preview blocks localhost: point them at the published site. (No effect on localhost, file:// or the live site.) */
  if (!/^(https?|file):$/.test(location.protocol)) document.write('<base href="https://portfolio-gallery-peach.vercel.app/designs/">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manisha Baroliya — Product designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
  <style>
    body { margin: 0; background: #000; font-family: system-ui, sans-serif; }
    .serif { font-family: 'Instrument Serif', serif; }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .back-link {
      position: fixed; left: 12px; bottom: 12px; z-index: 60;
      font: 12px system-ui, sans-serif; color: rgba(255,255,255,.85);
      padding: 6px 12px; border-radius: 999px; text-decoration: none; background: rgba(0,0,0,.5);
    }
  </style>
</head>
<body class="bg-black">
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const SOCIAL = 'shelf-library.html#social', LIB = 'shelf-library.html#library';

    const Icon = ({ size = 24, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Globe = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>;
    const ArrowRight = (p) => <Icon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
    const ArrowUpRight = (p) => <Icon {...p}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Icon>;
    const Instagram = (p) => <Icon {...p}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></Icon>;
    const Linkedin = (p) => <Icon {...p}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></Icon>;

    // Scroll-in reveal (stands in for framer-motion's useInView + animate)
    function Reveal({ children, className = '', delay = 0, duration = 0.7, y = 0, x = 0 }) {
      const ref = useRef(null);
      const [seen, setSeen] = useState(false);
      useEffect(() => {
        const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { rootMargin: '0px 0px -100px 0px' });
        io.observe(ref.current);
        return () => io.disconnect();
      }, []);
      return (
        <div ref={ref} className={className} style={{
          opacity: seen ? 1 : 0,
          transform: seen ? 'none' : `translate(${x}px, ${y}px)`,
          transition: `opacity ${duration}s ease-out ${delay}s, transform ${duration}s ease-out ${delay}s`,
        }}>{children}</div>
      );
    }

    function Video({ src, className = '' }) {
      return <video src={src} muted autoPlay loop playsInline preload="auto" className={className} />;
    }

    // Hero video: manual opacity fade in / out / loop
    function HeroVideo() {
      const ref = useRef(null);
      useEffect(() => {
        const v = ref.current;
        let raf = 0, fadingOut = false;
        const fade = (to, ms = 500) => {
          cancelAnimationFrame(raf);
          const from = parseFloat(v.style.opacity || '0'), t0 = performance.now();
          const step = (t) => {
            const k = Math.min(1, (t - t0) / ms);
            v.style.opacity = String(from + (to - from) * k);
            if (k < 1) raf = requestAnimationFrame(step);
          };
          raf = requestAnimationFrame(step);
        };
        const onCanPlay = () => { v.play().catch(() => {}); fade(1); };
        const onTime = () => {
          if (v.duration && v.duration - v.currentTime <= 0.55 && !fadingOut) { fadingOut = true; fade(0); }
        };
        const onEnded = () => {
          v.style.opacity = '0';
          setTimeout(() => { v.currentTime = 0; fadingOut = false; v.play().catch(() => {}); fade(1); }, 100);
        };
        v.addEventListener('canplay', onCanPlay);
        v.addEventListener('timeupdate', onTime);
        v.addEventListener('ended', onEnded);
        return () => { cancelAnimationFrame(raf); v.removeEventListener('canplay', onCanPlay); v.removeEventListener('timeupdate', onTime); v.removeEventListener('ended', onEnded); };
      }, []);
      return <video ref={ref} muted autoPlay playsInline preload="auto" style={{ opacity: 0 }}
        className="absolute inset-0 w-full h-full object-cover object-center"
        src="assets/asme/robot.mp4" />;
    }

    function Hero() {
      return (
        <div className="min-h-screen overflow-hidden relative flex flex-col">
          <div className="absolute inset-0 overflow-hidden bg-black">
            {/* the film sits below the words, so the figure is never behind the text */}
            <div className="absolute inset-x-0 bottom-0 top-[40%] sm:top-[30%]" style={{ WebkitMaskImage: 'linear-gradient(180deg, transparent 0%, #000 22%)', maskImage: 'linear-gradient(180deg, transparent 0%, #000 22%)' }}>
              <HeroVideo />
              <div className="absolute inset-0 pointer-events-none" style={{ background: 'linear-gradient(180deg, rgba(0,0,0,0) 70%, rgba(0,0,0,.55) 100%)' }} />
            </div>
          </div>
          <nav className="relative z-20 px-6 py-6">
            <div className="liquid-glass rounded-full max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
              <div className="flex items-center">
                <a href="#" aria-label="Manisha Baroliya"><img src="assets/logo-dark.webp" alt="Manisha Baroliya" width="380" height="199" className="h-10 md:h-11 w-auto" /></a>
                <div className="hidden md:flex items-center gap-8 ml-8">
                  {[['Work', LIB], ['About', 'halcyon-hero.html'], ['Social', SOCIAL]].map(([l, h]) => <a key={l} href={h} target="_top" className="text-white/80 hover:text-white text-sm font-medium">{l}</a>)}
                </div>
              </div>
              <div className="flex items-center gap-4">
                <a href={LIB} target="_top" className="hidden sm:inline text-white text-sm font-medium">My work</a>
                <a href={SOCIAL} target="_top" className="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium">Get in touch</a>
              </div>
            </div>
          </nav>

          <div className="relative z-10 flex-1 flex flex-col items-center px-6 pt-4 md:pt-6 pb-8 md:pb-10 text-center">
            <h1 className="serif text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-white tracking-tight md:whitespace-nowrap leading-[0.95] mb-3 md:mb-3">
              Design with <em className="italic">calm</em>.
            </h1>
            <p className="text-white text-sm leading-relaxed px-4 max-w-xl">
              Hi, I’m Manisha, a product designer and UX researcher with a psychology background. 3+ years, 20+ live designs, 10+ SaaS and B2B platforms.
            </p>
            <div className="flex-1" />
            <a href={LIB} target="_top" className="inline-block liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors">See my work</a>
          </div>

          <div className="absolute z-20 right-4 md:right-auto md:left-10 bottom-6 md:bottom-10 flex flex-col gap-3">
            {[Instagram, Linkedin, Globe].map((I, i) => (
              <a key={i} href={SOCIAL} target="_top" className="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all"><I size={20} /></a>
            ))}
          </div>
        </div>
      );
    }

    function About() {
      return (
        <section className="bg-black pt-32 md:pt-44 pb-2 md:pb-4 px-6 overflow-hidden relative">
          <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(255,255,255,0.03)_0%,_transparent_70%)]" />
          <div className="relative max-w-6xl mx-auto text-center">
            <Reveal y={20} duration={0.6}><p className="text-white/40 text-sm tracking-widest uppercase mb-6">About me</p></Reveal>
            <Reveal y={40} duration={0.8} delay={0.1}>
              <h2 className="text-4xl md:text-6xl lg:text-7xl text-white leading-[1.1] tracking-tight">
                Turning messy <span className="serif italic text-white/60">ideas</span> into{" "}<br className="hidden md:block" />
                interfaces that <span className="serif italic text-white/60">feel clear and human.</span>
              </h2>
            </Reveal>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <div className="bg-black"><Hero /><About /></div>
    );
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
</html>
