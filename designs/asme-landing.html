<body class="bg-black">
  <div id="root"></div>
  <a class="back-link" href="shelf-library.html#library">&larr; Library</a>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;
    const SOCIAL = 'shelf-library.html#social', LIB = 'shelf-library.html#library';

    const Icon = ({ size = 24, className, children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Globe = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></Icon>;
    const ArrowRight = (p) => <Icon {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></Icon>;
    const ArrowUpRight = (p) => <Icon {...p}><path d="M7 7h10v10"/><path d="M7 17 17 7"/></Icon>;
    const Instagram = (p) => <Icon {...p}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></Icon>;
    const Linkedin = (p) => <Icon {...p}><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></Icon>;

    // Scroll-in reveal (stands in for framer-motion's useInView + animate)
    function Reveal({ children, className = '', delay = 0, duration = 0.7, y = 0, x = 0 }) {
      const ref = useRef(null);
      const [seen, setSeen] = useState(false);
      useEffect(() => {
        const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { rootMargin: '0px 0px -100px 0px' });
        io.observe(ref.current);
        return () => io.disconnect();
      }, []);
      return (
        <div ref={ref} className={className} style={{
          opacity: seen ? 1 : 0,
          transform: seen ? 'none' : `translate(${x}px, ${y}px)`,
          transition: `opacity ${duration}s ease-out ${delay}s, transform ${duration}s ease-out ${delay}s`,
        }}>{children}</div>
      );
    }

    function Video({ src, className = '' }) {
      return <video src={src} muted autoPlay loop playsInline preload="auto" className={className} />;
    }

    // Hero video: manual opacity fade in / out / loop
    function HeroVideo() {
      const ref = useRef(null);
      useEffect(() => {
        const v = ref.current;
        let raf = 0, fadingOut = false;
        const fade = (to, ms = 500) => {
          cancelAnimationFrame(raf);
          const from = parseFloat(v.style.opacity || '0'), t0 = performance.now();
          const step = (t) => {
            const k = Math.min(1, (t - t0) / ms);
            v.style.opacity = String(from + (to - from) * k);
            if (k < 1) raf = requestAnimationFrame(step);
          };
          raf = requestAnimationFrame(step);
        };
        const onCanPlay = () => { v.play().catch(() => {}); fade(1); };
        const onTime = () => {
          if (v.duration && v.duration - v.currentTime <= 0.55 && !fadingOut) { fadingOut = true; fade(0); }
        };
        const onEnded = () => {
          v.style.opacity = '0';
          setTimeout(() => { v.currentTime = 0; fadingOut = false; v.play().catch(() => {}); fade(1); }, 100);
        };
        v.addEventListener('canplay', onCanPlay);
        v.addEventListener('timeupdate', onTime);
        v.addEventListener('ended', onEnded);
        return () => { cancelAnimationFrame(raf); v.removeEventListener('canplay', onCanPlay); v.removeEventListener('timeupdate', onTime); v.removeEventListener('ended', onEnded); };
      }, []);
      return <video ref={ref} muted autoPlay playsInline preload="auto" style={{ opacity: 0 }}
        className="absolute inset-0 w-full h-full object-cover object-bottom"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260405_074625_a81f018a-956b-43fb-9aee-4d1508e30e6a.mp4" />;
    }

    // The head follows the cursor like a real one: the eyes lead on a fast spring, the head trails on a slower one
    // and overshoots a touch; the nine turns of the 3x3 sheet are cross-faded by position, never snapped.
    function Mascot() {
      const outer = useRef(null), head = useRef(null), rx = useRef(null), layers = useRef([]);
      useEffect(() => {
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const clamp = (v, a = -1, b = 1) => Math.min(b, Math.max(a, v));
        const pos = (i) => `${(i % 3) * 50}% ${Math.floor(i / 3) * 50}%`;
        let tx = 0, ty = 0, ex = 0, ey = 0, evx = 0, evy = 0, hx = 0, hy = 0, hvx = 0, hvy = 0;
        let raf = 0, last = performance.now(), idleSince = last, nextGlance = last + 2500, gx = 0, gy = 0, rxTimer = 0;
        const onMove = (e) => {
          const r = outer.current.getBoundingClientRect();
          tx = Math.tanh((e.clientX - (r.left + r.width / 2)) / (innerWidth * 0.28)) * 1.05;
          ty = Math.tanh((e.clientY - (r.top + r.height * 0.4)) / (innerHeight * 0.34)) * 1.05;
          tx = clamp(tx); ty = clamp(ty); idleSince = performance.now(); gx = gy = 0;
        };
        const onLeave = () => { tx = ty = 0; };
        const spring = (x, v, target, k, c, dt) => { v += ((target - x) * k - v * c) * dt; return [x + v * dt, v]; };
        const frame = (now) => {
          raf = requestAnimationFrame(frame);
          const dt = Math.min(0.05, (now - last) / 1000); last = now;
          if (now - idleSince > 2600 && now > nextGlance) {      // when nobody is moving, she glances about a little
            gx = (Math.random() - 0.5) * 0.9; gy = (Math.random() - 0.5) * 0.5; nextGlance = now + 1600 + Math.random() * 2400;
          }
          const aimX = clamp(tx + gx), aimY = clamp(ty + gy);
          if (reduced) { ex = aimX; ey = aimY; hx = aimX * 0.8; hy = aimY * 0.8; }
          else {
            [ex, evx] = spring(ex, evx, aimX, 190, 21, dt);      // eyes: quick, settled
            [ey, evy] = spring(ey, evy, aimY, 190, 21, dt);
            [hx, hvx] = spring(hx, hvx, aimX * 0.85, 46, 8.5, dt); // head: slower, a little overshoot
            [hy, hvy] = spring(hy, hvy, aimY * 0.85, 46, 8.5, dt);
          }
          const u = clamp(ex + 1, 0, 2), v = clamp(ey + 1, 0, 2);
          const c0 = Math.min(1, Math.floor(u)), r0 = Math.min(1, Math.floor(v)), fu = u - c0, fv = v - r0;
          const cells = [[r0 * 3 + c0, (1 - fu) * (1 - fv)], [r0 * 3 + c0 + 1, fu * (1 - fv)], [(r0 + 1) * 3 + c0, (1 - fu) * fv], [(r0 + 1) * 3 + c0 + 1, fu * fv]].sort((a, b) => b[1] - a[1]);
          let acc = 0;
          cells.forEach(([i, w], k) => {
            const el = layers.current[k]; acc += w;
            el.style.backgroundPosition = pos(i);
            el.style.opacity = k === 0 ? 1 : (acc > 0 ? (w / acc).toFixed(3) : 0);
          });
          const t = now / 1000, breath = reduced ? 0 : Math.sin(t * 1.7);
          head.current.style.transform = `perspective(900px) translate3d(${(hx * 16).toFixed(2)}px, ${(hy * 9 + breath * 2.2).toFixed(2)}px, 0) rotateY(${(hx * 8).toFixed(2)}deg) rotateX(${(-hy * 5).toFixed(2)}deg) rotateZ(${(hx * 1.6).toFixed(2)}deg) scale(${(1 + breath * 0.006).toFixed(4)})`;
        };
        raf = requestAnimationFrame(frame);
        addEventListener('pointermove', onMove); addEventListener('pointerdown', onMove);
        document.documentElement.addEventListener('mouseleave', onLeave);
        const poke = () => {
          const el = rx.current; el.style.backgroundPosition = pos(Math.floor(Math.random() * 9)); el.style.opacity = 1;
          clearTimeout(rxTimer); rxTimer = setTimeout(() => { el.style.opacity = 0; }, 1300);
        };
        outer.current.addEventListener('click', poke);
        const o = outer.current;
        return () => { cancelAnimationFrame(raf); clearTimeout(rxTimer); removeEventListener('pointermove', onMove); removeEventListener('pointerdown', onMove); document.documentElement.removeEventListener('mouseleave', onLeave); o.removeEventListener('click', poke); };
      }, []);
      const sheet = (u) => ({ position: 'absolute', inset: 0, backgroundImage: `url(${u})`, backgroundSize: '300% 300%', backgroundRepeat: 'no-repeat' });
      return (
        <div ref={outer} role="img" aria-label="Animated portrait that follows your cursor" className="relative mx-auto shrink-0 cursor-pointer select-none"
          style={{ width: 'min(86vw, 40vh, 460px)', minWidth: 220, aspectRatio: '1 / 1',
            WebkitMaskImage: 'radial-gradient(ellipse 50% 50% at 50% 46%, #000 52%, transparent 100%)', maskImage: 'radial-gradient(ellipse 50% 50% at 50% 46%, #000 52%, transparent 100%)' }}>
          <div ref={head} style={{ position: 'absolute', inset: 0, willChange: 'transform' }}>
            {[0, 1, 2, 3].map((k) => <div key={k} ref={(el) => (layers.current[k] = el)} style={sheet('assets/asme/mascot-dirs.webp')} />)}
            <div ref={rx} style={{ ...sheet('assets/asme/mascot-reacts.webp'), opacity: 0, transition: 'opacity .18s ease-out' }} />
          </div>
        </div>
      );
    }

    function Hero() {
      return (
        <div className="min-h-screen overflow-hidden relative flex flex-col">
          <div className="absolute inset-0 overflow-hidden" style={{ background: 'radial-gradient(ellipse 70% 55% at 50% 68%, #1b2a6b 0%, #0b1334 48%, #05060f 85%)' }}>
          </div>
          <nav className="relative z-20 px-6 py-6">
            <div className="liquid-glass rounded-full max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
              <div className="flex items-center">
                <a href="#" aria-label="Manisha Baroliya"><img src="assets/logo-dark.webp" alt="Manisha Baroliya" width="380" height="199" className="h-10 md:h-11 w-auto" /></a>
                <div className="hidden md:flex items-center gap-8 ml-8">
                  {[['Work', LIB], ['About', 'halcyon-hero.html'], ['Social', SOCIAL]].map(([l, h]) => <a key={l} href={h} target="_top" className="text-white/80 hover:text-white text-sm font-medium">{l}</a>)}
                </div>
              </div>
              <div className="flex items-center gap-4">
                <a href={LIB} target="_top" className="hidden sm:inline text-white text-sm font-medium">My work</a>
                <a href={SOCIAL} target="_top" className="liquid-glass rounded-full px-6 py-2 text-white text-sm font-medium">Get in touch</a>
              </div>
            </div>
          </nav>

          <div className="relative z-10 flex-1 flex flex-col items-center px-6 pt-4 md:pt-6 pb-8 md:pb-10 text-center">
            <h1 className="serif text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-white tracking-tight whitespace-nowrap mb-2 md:mb-3">
              Design with <em className="italic">calm</em>.
            </h1>
            <p className="text-white text-sm leading-relaxed px-4 max-w-xl">
              Hi, I’m Manisha, a product designer and UX researcher with a psychology background. 3+ years, 20+ live designs, 10+ SaaS and B2B platforms.
            </p>
            <div className="flex-1 flex items-center justify-center w-full min-h-0 py-2"><Mascot /></div>
            <a href={LIB} target="_top" className="inline-block liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors">See my work</a>
          </div>

          <div className="absolute z-20 right-4 md:right-auto md:left-10 bottom-6 md:bottom-10 flex flex-col gap-3">
            {[Instagram, Linkedin, Globe].map((I, i) => (
              <a key={i} href={SOCIAL} target="_top" className="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all"><I size={20} /></a>
            ))}
          </div>
        </div>
      );
    }

    function About() {
      return (
        <section className="bg-black pt-32 md:pt-44 pb-10 md:pb-14 px-6 overflow-hidden relative">
          <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(255,255,255,0.03)_0%,_transparent_70%)]" />
          <div className="relative max-w-6xl mx-auto text-center">
            <Reveal y={20} duration={0.6}><p className="text-white/40 text-sm tracking-widest uppercase mb-6">About me</p></Reveal>
            <Reveal y={40} duration={0.8} delay={0.1}>
              <h2 className="text-4xl md:text-6xl lg:text-7xl text-white leading-[1.1] tracking-tight">
                Turning messy <span className="serif italic text-white/60">ideas</span> into<br className="hidden md:block" />
                interfaces that <span className="serif italic text-white/60">feel clear and human.</span>
              </h2>
            </Reveal>
          </div>
        </section>
      );
    }

    function Philosophy() {
      return (
        <section className="bg-black py-28 md:py-40 px-6 overflow-hidden">
          <div className="max-w-6xl mx-auto">
            <Reveal y={40} duration={0.8}>
              <h2 className="text-5xl md:text-7xl lg:text-8xl text-white tracking-tight mb-16 md:mb-24">
                Research <span className="serif italic text-white/40">x</span> Design
              </h2>
            </Reveal>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
              <Reveal x={-40} duration={0.8}>
                <div className="rounded-3xl overflow-hidden aspect-[4/3]">
                  <Video className="w-full h-full object-cover" src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260307_083826_e938b29f-a43a-41ec-a153-3d4730578ab8.mp4" />
                </div>
              </Reveal>
              <Reveal x={40} duration={0.8} delay={0.1} className="flex flex-col justify-center gap-8">
                <div>
                  <p className="text-white/40 text-xs tracking-widest uppercase mb-4">Start with people</p>
                  <p className="text-white/70 text-base md:text-lg leading-relaxed">Good products begin with listening. I map real behaviour, needs and friction before a single screen is drawn.</p>
                </div>
                <div className="w-full h-px bg-white/10" />
                <div>
                  <p className="text-white/40 text-xs tracking-widest uppercase mb-4">Shape the product</p>
                  <p className="text-white/70 text-base md:text-lg leading-relaxed">Then I turn insight into clean flows and one tidy design system, shipped across 10+ SaaS and B2B platforms.</p>
                </div>
              </Reveal>
            </div>
          </div>
        </section>
      );
    }

    function Playground() {
      return (
        <section className="bg-black py-24 md:py-36 px-6 overflow-hidden relative">
          <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(255,160,60,0.07)_0%,_transparent_60%)]" />
          <div className="relative max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 items-center gap-10 md:gap-6">
            <Reveal x={-40} duration={0.8} className="order-2 md:order-1">
              <p className="text-white/40 text-xs tracking-widest uppercase mb-5">Small joys</p>
              <h2 className="text-4xl md:text-6xl text-white tracking-tight leading-[1.1]">
                Calm on the surface, <span className="serif italic text-white/50">curious underneath.</span>
              </h2>
              <p className="mt-6 text-white/60 text-base md:text-lg leading-relaxed max-w-md">I like products that glide: quiet interfaces with one playful detail that makes people smile.</p>
              <a href={SOCIAL} target="_top" className="mt-8 inline-block liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors">Say hello</a>
            </Reveal>
            <Reveal x={40} duration={0.8} delay={0.1} className="order-1 md:order-2 flex justify-center">
              <video src="assets/fish/goldfish.mp4" muted autoPlay loop playsInline preload="auto" aria-hidden="true"
                className="w-full max-w-[400px] h-[440px] md:h-[560px] object-cover" style={{ mixBlendMode: 'screen' }} />
            </Reveal>
          </div>
        </section>
      );
    }

    const SERVICES = [
      { src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4', tag: 'Research', title: 'UX Research & Insight', body: 'Interviews, journeys and flows grounded in psychology, so every decision has a reason behind it.' },
      { src: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260324_151826_c7218672-6e92-402c-9e45-f1e0f454bdc4.mp4', tag: 'Craft', title: 'Product & Systems Design', body: 'From first sketch to live product, I care about the details that make interfaces feel effortless.' },
    ];

    function Services() {
      return (
        <section className="bg-black py-28 md:py-40 px-6 overflow-hidden relative">
          <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_rgba(255,255,255,0.02)_0%,_transparent_60%)]" />
          <div className="relative max-w-6xl mx-auto">
            <Reveal y={30} duration={0.7} className="flex items-end justify-between mb-12 md:mb-16">
              <h2 className="text-3xl md:text-5xl text-white tracking-tight">What I do</h2>
              <p className="hidden md:block text-white/40 text-sm">My services</p>
            </Reveal>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
              {SERVICES.map((s, i) => (
                <Reveal key={s.title} y={50} duration={0.8} delay={i * 0.15}>
                  <div className="liquid-glass rounded-3xl overflow-hidden group">
                    <div className="relative aspect-video overflow-hidden">
                      <Video src={s.src} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent" />
                    </div>
                    <div className="p-6 md:p-8">
                      <div className="flex items-center justify-between mb-4">
                        <span className="uppercase tracking-widest text-white/40 text-xs">{s.tag}</span>
                        <span className="liquid-glass rounded-full p-2 text-white"><ArrowUpRight size={16} /></span>
                      </div>
                      <h3 className="text-white text-xl md:text-2xl mb-3 tracking-tight">{s.title}</h3>
                      <p className="text-white/50 text-sm leading-relaxed">{s.body}</p>
                    </div>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <div className="bg-black"><Hero /><About /><Playground /><Philosophy /><Services /></div>
    );
  </script>
  <script data-embed-hook>if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add("embed")</script>
  <style>.embed .back-link { display: none !important; }</style>
</body>
